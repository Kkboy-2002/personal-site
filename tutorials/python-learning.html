"scope":"模块","vars":[{"name":"port","type":"str","value":"'COM3'"},{"name":"baud","type":"int","value":"115200"},{"name":"connected","type":"bool","value":"False"},{"name":"temperature","type":"float","value":"25.5"},{"name":"device","type":"NoneType","value":"None"}],"output":"COM3 115200\nint\n","note":"执行完成。可以回到任意一步查看状态，或下载代码，在本机修改后运行。"}]},{"id":"strings","group":"python","title":"字符串与格式化","time":"4 分钟","mode":"trace","summary":"str 用来处理人能读懂的文字；f-string 把变量放进一句话。","description":"串口配置、日志、输入框里的内容，大多从字符串开始。先掌握清理、转换和拼接。","points":["strip() 清理两端空白；不会删掉中间的空格。","f\"{变量}\" 可以直接插入变量，{value:.1f} 保留一位小数。","字符串不能原地修改；方法通常返回一个新字符串，需要接住返回值。"],"code":"text = \" 9600 \"\nclean = text.strip()\nbaud = int(clean)\ntemperature = 25.56\nmessage = f\"波特率：{baud}\"\nreading = f\"温度：{temperature:.1f} °C\"\ncommand = \"LED ON\" + \"\\n\"\nprint(message)\nprint(reading)\nprint(repr(command))\n","notes":{"2":"strip() 返回新字符串。右边 text 仍然保留两端空格。","3":"把只有数字的字符串转换为整数。","6":":.1f 的意思是按小数格式保留一位。","7":"\\n 表示一个换行字符。许多文本协议用换行表示一条命令结束。","10":"repr() 显示转义写法，让平时看不见的换行变得可见。"},"tip":"int('abc') 会抛出 ValueError。处理用户输入时，后面会学到的 try / except 可以接住这种错误。","quiz":{"question":"text.strip() 执行后，没有重新赋值，text 自己会变吗？","options":["会直接删掉空白","不会，返回的是新字符串","会变成整数"],"answer":1,"explanation":"str 是不可变对象。要保存清理后的结果，写 text = text.strip()。"},"number":"02","filename":"strings.py","states":[{"line":1,"scope":"模块","vars":[],"output":"","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":2,"scope":"模块","vars":[{"name":"text","type":"str","value":"' 9600 '"}],"output":"","note":"strip() 返回新字符串。右边 text 仍然保留两端空格。"},{"line":3,"scope":"模块","vars":[{"name":"text","type":"str","value":"' 9600 '"},{"name":"clean","type":"str","value":"'9600'"}],"output":"","note":"把只有数字的字符串转换为整数。"},{"line":4,"scope":"模块","vars":[{"name":"text","type":"str","value":"' 9600 '"},{"name":"clean","type":"str","value":"'9600'"},{"name":"baud","type":"int","value":"9600"}],"output":"","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":5,"scope":"模块","vars":[{"name":"text","t tput":"","note":"只增加调用 add() 的那个对象的计数。"},{"line":12,"scope":"模块","vars":[{"name":"Counter","type":"type","value":"\u003c类 Counter>"},{"name":"first","type":"Counter","value":"Counter({'value': 2})"},{"name":"second","type":"Counter","value":"Counter({'value': 0})"}],"output":"","note":"first 加了两次，second 一次也没加，所以输出 2 0。"},{"line":null,"scope":"模块","vars":[{"name":"Counter","type":"type","value":"\u003c类 Counter>"},{"name":"first","type":"Counter","value":"Counter({'value': 2})"},{"name":"second","type":"Counter","value":"Counter({'value': 0})"}],"output":"2 0\n","note":"执行完成。可以回到任意一步查看状态，或下载代码，在本机修改后运行。"}]},{"id":"errors","group":"python","title":"异常、模块与保存配置","time":"6 分钟","mode":"trace","summary":"import 引入工具；try / except 处理预期错误；with 帮你收好文件。","description":"先处理非法的波特率输入，再把配置变成 JSON 文字。文件保存示例在下方，复制后可单独运行。","points":["只捕获你能处理的异常，例如 ValueError；不要用 except: pass 把错误藏起来。","json、pathlib、struct 是 Python 标准库，不需要 pip 安装。","with open(..., encoding='utf-8') 会在结束时关闭文件，Windows 下也应明确编码。"],"code":"import json\n\nuser_input = \"abc\"\ntry:\n    baud = int(user_input)\nexcept ValueError:\n    baud = 9600\n    print(\"输入不是整数，改用 9600\")\nconfig = {\"port\": \"COM3\", \"baud\": baud}\nsaved = json.dumps(config, ensure_ascii=False)\nloaded = json.loads(saved)\nprint(loaded[\"baud\"])\n","notes":{"1":"加载标准库 json，用来把字典与 JSON 文字互相转换。","5":"abc 不能变成整数，会触发 ValueError。","6":"跳到匹配的 except 分支；程序可以继续处理。","10":"dumps 的 s 可以理解为 string：结果是字符串。","11":"loads 从 JSON 字符串还原 Python 对象。"},"extraCode":"import json\nfrom pathlib import Path\n\n# 写到这个脚本旁边，方便找到。\npath = Path(__file__).with_name(\"config.json\")\nconfig = {\"port\": \"COM3\", \"baud\": 9600}\nwith path.open(\"w\", encoding=\"utf-8\") as file:\n    json.dump(config, file, ensure_ascii=False, indent=2)\nwith path.open(\"r\", encoding=\"utf-8\") as file:\n    loaded = json.load(file)\nprint(loaded)\n","extraTitle":"再走一步：把配置真正保存成文件","tip":"不要把自己的文件命名为 serial.py、json.py 或 PyQt6.py，否则可能挡住真正要导入的库。","quiz":{"question":"json 是标准库，使用前需要 pip install json 吗？","options":["需要","不需要，直接 import json","只能在 PyQt 中使用"],"answer":1,"explanation":"json 随 Python 提供。PyQt6 和 pyserial 才是这里需要额外安装的第三方包。"},"number":"07","filename":"errors.py","states":[{"line":1,"scope":"模块","vars":[],"output":"","note":"加载标准库 json，用来把字典与 JSON 文字互相转换。"},{"line":3,"scope":"模块","vars":[],"output":"","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":4,"scope":"模块","vars":[{"name":"user_input","type":"str","value":"'abc'"}],"output":"","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":5,"scope":"模块","vars":[{"name":"user_input","type":"str","value":"'abc'"}],"output":"","note":"abc 不能变成整数，会触发 ValueError。"},{"line":6,"scope":"模块","vars":[{"name":"user_input","type":"str","value":"'abc'"}],"output":"","note":"跳到匹配的 except 分支；程序可以继续处理。"},{"line":7,"scope":"模块","vars":[{"name":"user_input","type":"str","value":"'abc'"}],"output":"","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":8,"scope":"模块","vars":[{"name":"user_input","type":"str","value":"'abc'"},{"name":"baud","type":"int","value":"9600"}],"output":"","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":9,"scope":"模块","vars":[{"name":"user_input","type":"str","value":"'abc'"},{"name":"baud","type":"int","value":"9600"}],"output":"输入不是整数，改用 9600\n","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":10,"scope":"模块","vars":[{"name":"user_input","type":"str","value":"'abc'"},{"name":"baud","type":"int","value":"9600"},{"name":"config","type":"dict","value":"{'port': 'COM3', 'baud': 9600}"}],"output":"输入不是整数，改用 9600\n","note":"dumps 的 s 可以理解为 string：结果是字符串。"},{"line":11,"scope":"模块","vars":[{"name":"user_input","type":"str","value":"'abc'"},{"name":"baud","type":"int","value":"9600"},{"name":"config","type":"dict","value":"{'port': 'COM3', 'baud': 9600}"},{"name":"saved","type":"str","value":"'{\"port\": \"COM3\", \"baud\": 9600}'"}],"output":"输入不是整数，改用 9600\n","note":"loads 从 JSON 字符串还原 Python 对象。"},{"line":12,"scope":"模块","vars":[{"name":"user_input","type":"str","value":"'abc'"},{"name":"baud","type":"int","value":"9600"},{"name":"config","type":"dict","value":"{'port': 'COM3', 'baud': 9600}"},{"name":"saved","type":"str","value":"'{\"port\": \"COM3\", \"baud\": 9600}'"},{"name":"loaded","type":"dict","value":"{'port': 'COM3', 'baud': 9600}"}],"output":"输入不是整数，改用 9600\n","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":null,"scope":"模块","vars":[{"name":"user_input","type":"str","value":"'abc'"},{"name":"baud","type":"int","value":"9600"},{"name":"config","type":"dict","value":"{'port': 'COM3', 'baud': 9600}"},{"name":"saved","type":"str","value":"'{\"port\": \"COM3\", \"baud\": 9600}'"},{"name":"loaded","type":"dict","value":"{'port': 'COM3', 'baud': 9600}"}],"output":"输入不是整数，改用 9600\n9600\n","note":"执行完成。可以回到任意一步查看状态，或下载代码，在本机修改后运行。"}]},{"id":"bytes","group":"python","title":"str、bytes 与十六进制","time":"6 分钟","mode":"trace","summary":"文字给人看，字节给设备传；encode 和 decode 是两座桥。","description":"这是从 Python 走向串口通信最关键的一步。先分清文本 'AA' 和数值为 0xAA 的那个字节。","points":["'LED ON' 是 str；b'LED ON' 是 bytes，b 前缀只能直接写 ASCII 字符。","text.encode('utf-8') 把文字转为字节；raw.decode('utf-8') 反过来。","bytes 不可变，bytearray 可追加、可删除，适合做接收缓冲区。"],"code":"text = \"LED ON\\n\"\npayload = text.encode(\"utf-8\")\nrestored = payload.decode(\"utf-8\")\nraw = bytes.fromhex(\"AA 01 FF\")\nascii_text = \"AA\".encode(\"ascii\")\nchinese = \"温\".encode(\"utf-8\")\nprint(payload.hex(\" \").upper())\nprint(raw.hex(\" \").upper())\nprint(ascii_text.hex(\" \").upper())\nprint(len(chinese))\n","notes":{"2":"LED ON 加换行被编码为 7 个字节。","4":"十六进制 AA 01 FF 转成 3 个真正的字节。","5":"文字 AA 是两个 ASCII 字母，得到 41 41，而不是一个 AA。","6":"中文『温』在 UTF-8 中占 3 个字节；字数不等于字节数。","7":".hex(' ') 只改变显示方式，不会改变 payload 中的内容。"},"tip":"不能对随意收到的一小块数据立刻按 UTF-8 解码：一个汉字可能分两次到达。先按协议凑齐一帧，再解码。","quiz":{"question":"要发送一个 0xAA 字节，应该用哪种写法？","options":["'AA'.encode('utf-8')","bytes.fromhex('AA')","b'0xAA'"],"answer":1,"explanation":"bytes.fromhex('AA') 产生一个字节。其他两种写法发送的是可读字符的编码。"},"number":"08","filename":"bytes.py","states":[{"line":1,"scope":"模块","vars":[],"output":"","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":2,"scope":"模块","vars":[{"name":"text","type":"str","value":"'LED ON\\n'"}],"output":"","note":"LED ON 加换行被编码为 7 个字节。"},{"line":3,"scope":"模块","vars":[{"name":"text","type":"str","value":"'LED ON\\n'"},{"name":"payload","type":"bytes","value":"b'LED ON\\n'"}],"output":"","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":4,"scope":"模块","vars":[{"name":"text","type":"str","value":"'LED ON\\n'"},{"name":"payload","type":"bytes","value":"b'LED ON\\n'"},{"name":"restored","type":"str","value":"'LED ON\\n'"}],"output":"","note":"十六进制 AA 01 FF 转成 3 个真正的字节。"},{"line":5,"scope":"模块","vars":[{"name":"text","type":"str","value":"'LED ON\\n'"},{"name":"payload","type":"bytes","value":"b'LED ON\\n'"},{"name":"restored","type":"str","value":"'LED ON\\n'"},{"name":"raw","type":"bytes","value":"b'\\xaa\\x01\\xff'"}],"output":"","note":"文字 AA 是两个 ASCII 字母，得到 41 41，而不是一个 AA。"},{"line":6,"scope":"模块","vars":[{"name":"text","type":"str","value":"'LED ON\\n'"},{"name":"payload","type":"bytes","value":"b'LED ON\\n'"},{"name":"restored","type":"str","value":"'LED ON\\n'"},{"name":"raw","type":"bytes","value":"b'\\xaa\\x01\\xff'"},{"name":"ascii_text","type":"bytes","value":"b'AA'"}],"output":"","note":"中文『温』在 UTF-8 中占 3 个字节；字数不等于字节数。"},{"line":7,"scope":"模块","vars":[{"name":"text","type":"str","value":"'LED ON\\n'"},{"name":"payload","type":"bytes","value":"b'LED ON\\n'"},{"name":"restored","type":"str","value":"'LED ON\\n'"},{"name":"raw","type":"bytes","value":"b'\\xaa\\x01\\xff'"},{"name":"ascii_text","type":"bytes","value":"b'AA'"},{"name":"chinese","type":"bytes","value":"b'\\xe6\\xb8\\xa9'"}],"output":"","note":".hex(' ') 只改变显示方式，不会改变 payload 中的内容。"},{"line":8,"scope":"模块","vars":[{"name":"text","type":"str","value":"'LED ON\\n'"},{"name":"payload","type":"bytes","value":"b'LED ON\\n'"},{"name":"restored","type":"str","value":"'LED ON\\n'"},{"name":"raw","type":"bytes","value":"b'\\xaa\\x01\\xff'"},{"name":"ascii_text","type":"bytes","value":"b'AA'"},{"name":"chinese","type":"bytes","value":"b'\\xe6\\xb8\\xa9'"}],"output":"4C 45 44 20 4F 4E 0A\n","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":9,"scope":"模块","vars":[{"name":"text","type":"str","value":"'LED ON\\n'"},{"name":"payload","type":"bytes","value":"b'LED ON\\n'"},{"name":"restored","type":"str","value":"'LED ON\\n'"},{"name":"raw","type":"bytes","value":"b'\\xaa\\x01\\xff'"},{"name":"ascii_text","type":"bytes","value":"b'AA'"},{"name":"chinese","type":"bytes","value":"b'\\xe6\\xb8\\xa9'"}],"output":"4C 45 44 20 4F 4E 0A\nAA 01 FF\n","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":10,"scope":"模块","vars":[{"name":"text","type":"str","value":"'LED ON\\n'"},{"name":"payload","type":"bytes","value":"b'LED ON\\n'"},{"name":"restored","type":"str","value":"'LED ON\\n'"},{"name":"raw","type":"bytes","value":"b'\\xaa\\x01\\xff'"},{"name":"ascii_text","type":"bytes","value":"b'AA'"},{"name":"chinese","type":"bytes","value":"b'\\xe6\\xb8\\xa9'"}],"output":"4C 45 44 20 4F 4E 0A\nAA 01 FF\n41 41\n","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":null,"scope":"模块","vars":[{"name":"text","type":"str","value":"'LED ON\\n'"},{"name":"payload","type":"bytes","value":"b'LED ON\\n'"},{"name":"restored","type":"str","value":"'LED ON\\n'"},{"name":"raw","type":"bytes","value":"b'\\xaa\\x01\\xff'"},{"name":"ascii_text","type":"bytes","value":"b'AA'"},{"name":"chinese","type":"bytes","value":"b'\\xe6\\xb8\\xa9'"}],"output":"4C 45 44 20 4F 4E 0A\nAA 01 FF\n41 41\n3\n","note":"执行完成。可以回到任意一步查看状态，或下载代码，在本机修改后运行。"}]},{"id":"qt-window","group":"qt","title":"第一个 PyQt 窗口","time":"5 分钟","mode":"guide","summary":"创建应用 → 创建窗口 → show() → 进入事件循环。","description":"这是完整的最小程序。保存成 hello_qt.py，在装好 PyQt6 的 Python 环境中运行。","points":["QApplication 管理整个 GUI 应用，一般只创建一个。","QWidget 可以作为简单窗口；QMainWindow 适合菜单栏、工具栏等完整应用。","app.exec() 启动事件循环，让点击、重绘和定时器持续得到处理。"],"filename":"hello_qt.py","code":"import sys\nfrom PyQt6.QtWidgets import QApplication, QWidget\n\napp = QApplication(sys.argv)\nwindow = QWidget()\nwindow.setWindowTitle(\"我的第一个窗口\")\nwindow.resize(480, 300)\nwindow.show()\nsys.exit(app.exec())\n","guides":[["app =","先创建 QApplication，再创建任何界面控件。"],["window =","QWidget 是最基本的窗口，也可以作为其他控件的容器。"],["window.resize","设置初始大小。用户仍然可以拖动窗口边缘改变大小。"],["window.show","对象已经创建，但调用 show() 才会显示。"],["sys.exit","进入事件循环。关闭最后一个窗口后，app.exec() 才返回。"]],"expected":"本机运行后，出现一个标题为『我的第一个窗口』、初始大小 480 × 300 的空窗口。","tip":"本页的 PyQt 区域是结构讲解与交互示意。真正的桌面窗口需要下载 .py 文件并用本机 Python 运行。","quiz":{"question":"哪一行让窗口持续响应鼠标和键盘？","options":["window.resize(...) ","window.setWindowTitle(...) ","app.exec()"],"answer":2,"explanation":"事件循环负责分发界面事件。没有它，脚本很快执行结束，窗口也就关闭了。"},"number":"09","guideSteps":[{"line":4,"note":"先创建 QApplication，再创建任何界面控件。"},{"line":5,"note":"QWidget 是最基本的窗口，也可以作为其他控件的容器。"},{"line":7,"note":"设置初始大小。用户仍然可以拖动窗口边缘改变大小。"},{"line":8,"note":"对象已经创建，但调用 show() 才会显示。"},{"line":9,"note":"进入事件循环。关闭最后一个窗口后，app.exec() 才返回。"}]},{"id":"qt-widgets","group":"qt","title":"常用控件与布局","time":"6 分钟","mode":"guide","summary":"控件负责显示和输入；布局负责把控件排好。","description":"串口工具常用的输入框、端口下拉框、发送按钮和日志框，在这里一次认识。","points":["QLabel 显示文字，QLineEdit 输入一行文字，QPushButton 提供点击。","QComboBox 选择端口或波特率；QPlainTextEdit 显示多行日志。","QVBoxLayout 竖排，QHBoxLayout 横排；优先使用布局，窗口缩放时会自动调整。"],"filename":"widgets_qt.py","code":"import sys\nfrom PyQt6.QtWidgets import (\n    QApplication, QWidget, QVBoxLayout, QHBoxLayout,\n    QLabel, QLineEdit, QPushButton, QComboBox, QPlainTextEdit,\n)\n\napp = QApplication(sys.argv)\nwindow = QWidget()\nwindow.setWindowTitle(\"串口界面骨架\")\nlayout = QVBoxLayout(window)\nlayout.addWidget(QLabel(\"选择端口，输入命令\"))\nports = QComboBox()\nports.addItems([\"COM3（示意）\", \"COM4（示意）\"])\nlayout.addWidget(ports)\nrow = QHBoxLayout()\ncommand = QLineEdit(\"LED ON\")\nbutton = QPushButton(\"发送\")\nrow.addWidget(command)\nrow.addWidget(button)\nlayout.addLayout(row)\nlog = QPlainTextEdit()\nlog.setReadOnly(True)\nlayout.addWidget(log)\nwindow.resize(480, 300)\nwindow.show()\nsys.exit(app.exec())\n","guides":[["layout =","把竖向布局安装到窗口上，之后按顺序加入控件。"],["ports =","QComboBox 是下拉框。这里只写示意端口，真实枚举在串口章节。"],["row =","横向布局里并排放输入框和按钮，再嵌入外层竖向布局。"],["log.setReadOnly","日志用于展示信息，设为只读可以避免用户误改。"],["window.show","目前只有界面，还没连接按钮点击后的处理函数。"]],"expected":"一个有端口下拉框、命令输入框、发送按钮和日志区域的窗口。此节只搭界面，按钮还没有发送行为。","tip":"在窗口类中长期使用的控件保存成 self.command、self.log。布局会管理控件位置，Qt 的父子关系会管理大部分控件生命周期。","quiz":{"question":"要让输入框和发送按钮并排，应选择哪个布局？","options":["QVBoxLayout","QHBoxLayout","QTimer"],"answer":1,"explanation":"H 表示 horizontal（横向）；V 表示 vertical（竖向）。"},"number":"10","guideSteps":[{"line":10,"note":"把竖向布局安装到窗口上，之后按顺序加入控件。"},{"line":12,"note":"QComboBox 是下拉框。这里只写示意端口，真实枚举在串口章节。"},{"line":15,"note":"横向布局里并排放输入框和按钮，再嵌入外层竖向布局。"},{"line":22,"note":"日志用于展示信息，设为只读可以避免用户误改。"},{"line":25,"note":"目前只有界面，还没连接按钮点击后的处理函数。"}]},{"id":"qt-signals","group":"qt","title":"信号与槽","time":"6 分钟","mode":"guide","widget":"signal","summary":"信号说「事情发生了」，槽函数说「接下来做什么」。","description":"把按钮的 clicked 信号接到 send 函数。右边可以先点一下示意按钮，看看整个流程。","points":["button.clicked.connect(self.send) 建立连接，发送发生在以后点击按钮时。","槽可以是普通函数；pyqtSlot 装饰器常用于明确 Qt 槽，尤其是线程间通信。","自定义信号用 pyqtSignal(...) 写在类体中；发送数据时调用 .emit(...)。"],"filename":"signals_qt.py","code":"import sys\nfrom PyQt6.QtWidgets import (\n    QApplication, QWidget, QVBoxLayout,\n    QLineEdit, QPushButton, QLabel,\n)\n\nclass Window(QWidget):\n    def __init__(self):\n        super().__init__()\n        self.setWindowTitle(\"信号与槽\")\n        self.command = QLineEdit(\"LED ON\")\n        self.button = QPushButton(\"发送\")\n        self.status = QLabel(\"等待点击\")\n        layout = QVBoxLayout(self)\n        for widget in (self.command, self.button, self.status):\n            layout.addWidget(widget)\n        self.button.clicked.connect(self.send)\n\n    def send(self):\n        text = self.command.text()\n        self.status.setText(f\"准备发送：{text}\")\n\napp = QApplication(sys.argv)\nwindow = Window()\nwindow.show()\nsys.exit(app.exec())\n","guides":[["class Window","继承 QWidget，把界面和它的操作放在同一个小类里。"],["super().__init__","先初始化 QWidget，之后才能创建和使用这个窗口。"],["self.button.clicked","connect 只建立连接。这里传 self.send，不加括号。"],["def send","用户点击后，Qt 才调用这个方法。"],["text =",".text() 读出输入框里的 str，然后用 setText 更新标签。"]],"expected":"点击发送后，标签会显示『准备发送：LED ON』。这一步只更新标签，还没有操作串口。","tip":"不要在刷新页面或每次连接串口时反复 connect 同一个信号。重复连接可能让一次点击执行多次。","quiz":{"question":"正确的连接写法是哪一个？","options":["button.clicked.connect(self.send())","button.clicked.connect(self.send)","button.connect.clicked(self.send)"],"answer":1,"explanation":"self.send 是函数；self.send() 是立刻调用它。连接信号时要传函数。"},"number":"11","guideSteps":[{"line":7,"note":"继承 QWidget，把界面和它的操作放在同一个小类里。"},{"line":9,"note":"先初始化 QWidget，之后才能创建和使用这个窗口。"},{"line":17,"note":"connect 只建立连接。这里传 self.send，不加括号。"},{"line":19,"note":"用户点击后，Qt 才调用这个方法。"},{"line":20,"note":".text() 读出输入框里的 str，然后用 setText 更新标签。"}]},{"id":"qt-timer","group":"qt","title":"QTimer 与事件循环","time":"5 分钟","mode":"guide","widget":"timer","summary":"定时器到点通知一次，让出时间给界面处理其他事情。","description":"每秒更新一次计数，用它理解定时刷新、定时发送和超时提示。QTimer 本身不会创建新线程。","points":["timer.start(1000) 的单位是毫秒，也就是约 1 秒触发一次。","timeout 回调必须尽快返回；把耗时操作放在这里，界面仍然会卡。","停止用 stop()。QTimer.singleShot(...) 适合一次性的延迟操作。"],"filename":"timer_qt.py","code":"import sys\nfrom PyQt6.QtCore import QTimer\nfrom PyQt6.QtWidgets import QApplication, QLabel\n\nclass Counter(QLabel):\n    def __init__(self):\n        super().__init__(\"0 秒\")\n        self.count = 0\n        self.timer = QTimer(self)\n        self.timer.timeout.connect(self.tick)\n        self.timer.start(1000)\n\n    def tick(self):\n        self.count += 1\n        self.setText(f\"{self.count} 秒\")\n\napp = QApplication(sys.argv)\nwindow = Counter()\nwindow.resize(240, 100)\nwindow.show()\nsys.exit(app.exec())\n","guides":[["self.timer =","给定时器指定父对象 self，并保留引用；窗口销毁时会一起清理。"],["self.timer.timeout","连接超时通知和 tick 方法。"],["self.timer.start","启动每 1000 毫秒一次的定时通知，随后立即返回。"],["def tick","每次被调用时只做一点工作，不要放 sleep 或等待串口的循环。"]],"expected":"窗口大约每秒更新一次计数。定时器不是精密时钟，系统繁忙时触发可能延后。","tip":"GUI 主线程里不要 time.sleep()。QTimer 解决「等一会儿再做」，QThread 解决「这件事本身要做很久」。","quiz":{"question":"把耗时 5 秒的函数接到 QTimer.timeout，界面还会卡吗？","options":["不会，QTimer 自带线程","会，回调仍在定时器所属线程执行","只有第一次会卡"],"answer":1,"explanation":"本例的定时器和窗口都在主线程。QTimer 不会自动把回调移到后台。"},"number":"12","guideSteps":[{"line":9,"note":"给定时器指定父对象 self，并保留引用；窗口销毁时会一起清理。"},{"line":10,"note":"连接超时通知和 tick 方法。"},{"line":11,"note":"启动每 1000 毫秒一次的定时通知，随后立即返回。"},{"line":13,"note":"每次被调用时只做一点工作，不要放 sleep 或等待串口的循环。"}]},{"id":"qt-thread","group":"qt","title":"QThread：让界面保持响应","time":"8 分钟","mode":"guide","example":"thread_qt.py","summary":"后台负责慢工作，通过信号把结果送回主线程；主线程更新控件。","description":"这是一个可以启动、停止、关闭窗口的小例子。先理解职责分工，再把后台的工作换成有超时的串口读取。","points":["重写 run() 的 QThread 子类适合简单顺序任务；更复杂的事件驱动任务可用 QObject + moveToThread。","调用 start() 才会启动新线程；直接调用 run() 只是普通函数调用。","requestInterruption() 只提出停止请求，run() 必须主动检查。quit() 不会中断正在运行的循环。"],"guides":[["class Worker","这个类只负责后台工作，不持有、不访问任何窗口控件。"],["progress =","自定义信号定义在类体中，传递一个整数。"],["if self.isInterruptionRequested","每轮检查停止请求，主动 return 才会结束任务。"],["self.progress.emit","从后台发出数据，不在这里修改 QLabel。"],["self.worker.progress.connect","连接到 Window 的槽；跨线程结果通过队列交给主线程处理。"],["def closeEvent","关闭时先请求停止；若后台还没退出，暂缓关闭，让事件循环继续处理退出。"]],"expected":"点击开始后，后台分步处理，标签显示进度。停止可取消任务，关闭窗口会等待当前短步骤结束后再退出。","tip":"pyserial 的阻塞读取要设置 timeout，例如 0.1 秒，这样后台才能定期检查停止请求。不能用 terminate() 当作正常停止方式。","quiz":{"question":"后台收到数据后，应该怎样更新标签？","options":["在 run() 里直接 label.setText()","发出信号，由主线程的槽更新","给 label 加锁后在后台更新"],"answer":1,"explanation":"Qt 的 GUI 控件必须在主线程中操作。锁不能改变控件所属线程。"},"number":"13","filename":"thread_qt.py","code":"\"\"\"简单的后台任务。运行：python thread_qt.py；依赖：PyQt6。\"\"\"\n\nimport sys\n\nfrom PyQt6.QtCore import QThread, pyqtSignal, pyqtSlot\nfrom PyQt6.QtWidgets import (\n    QApplication, QWidget, QVBoxLayout, QPushButton, QLabel,\n)\n\n\nclass Worker(QThread):\n    progress = pyqtSignal(int)\n\n    def run(self):\n        for value in range(1, 21):\n            if self.isInterruptionRequested():\n                return\n            self.msleep(100)  # 模拟慢工作；这里是后台线程。\n            self.progress.emit(value)\n\n\nclass Window(QWidget):\n    def __init__(self):\n        super().__init__()\n        self.setWindowTitle(\"后台任务练习\")\n        self.worker = None\n        self.stop_requested = False\n        self.closing = False\n        self.status = QLabel(\"等待开始\")\n        self.start_button = QPushButton(\"开始\")\n        self.stop_button = QPushButton(\"停止\")\n        self.stop_button.setEnabled(False)\n        layout = QVBoxLayout(self)\n        for widget in (self.status, self.start_button, self.stop_button):\n            layout.addWidget(widget)\n        self.start_button.clicked.connect(self.start_work)\n        self.stop_button.clicked.connect(self.stop_work)\n\n    def start_work(self):\n        if self.worker is not None:\n            return\n        self.stop_requested = False\n        self.worker = Worker(self)\n        self.worker.progress.connect(self.show_progress)\n        self.worker.finished.connect(self.work_finished)\n        self.start_button.setEnabled(False)\n        self.stop_button.setEnabled(True)\n        self.status.setText(\"正在处理\")\n        self.worker.start()\n\n    @pyqtSlot(int)\n    def show_progress(self, value):\n        self.status.setText(f\"已处理 {value} / 20\")\n\n    def stop_work(self):\n        if self.worker is not None:\n            self.stop_requested = True\n            self.worker.requestInterruption()\n            self.stop_button.setEnabled(False)\n            self.status.setText(\"已请求停止\")\n\n    @pyqtSlot()\n    def work_finished(self):\n        worker = self.worker\n        if worker is None:\n            return\n        # finished 到达时 run 已结束；wait 同步线程最终的清理。\n        worker.wait()\n        worker.deleteLater()\n        self.worker = None\n        self.status.setText(\"已停止\" if self.stop_requested else \"处理完成\")\n        self.start_button.setEnabled(True)\n        self.stop_button.setEnabled(False)\n        if self.closing:\n            self.close()\n\n    def closeEvent(self, event):\n        if self.worker is not None:\n            self.closing = True\n            self.start_button.setEnabled(False)\n            self.stop_work()\n            event.ignore()  # 保持事件循环，等 finished 后再 close。\n            return\n        event.accept()\n\n\nif __name__ == \"__main__\":\n    app = QApplication(sys.argv)\n    window = Window()\n    window.resize(340, 160)\n    window.show()\n    sys.exit(app.exec())\n","guideSteps":[{"line":11,"note":"这个类只负责后台工作，不持有、不访问任何窗口控件。"},{"line":12,"note":"自定义信号定义在类体中，传递一个整数。"},{"line":16,"note":"每轮检查停止请求，主动 return 才会结束任务。"},{"line":19,"note":"从后台发出数据，不在这里修改 QLabel。"},{"line":44,"note":"连接到 Window 的槽；跨线程结果通过队列交给主线程处理。"},{"line":77,"note":"关闭时先请求停止；若后台还没退出，暂缓关闭，让事件循环继续处理退出。"}]},{"id":"serial-start","group":"serial","title":"串口参数与包怎么选","time":"5 分钟","mode":"serial-start","summary":"先约定如何传输，再约定每个字节代表什么。","description":"端口、波特率、数据位、校验位、停止位和流控要与设备一致。下面默认演示 9600、8N1、无流控。","points":["8N1 表示 8 个数据位、无校验、1 个停止位；9600 表示每秒约 9600 个信号位。","串口传的是字节流。一次 write 和一次 read 不一定一一对应。","设备协议决定命令、编码、结束符、长度或校验；从设备说明书确认，不能靠波特率猜。"],"tip":"Windows 的 COM3 只是例子；先枚举本机端口。另一个串口助手占着端口时，通常无法再次打开。9600 / 8N1 下，一个数据字节常占 10 位，理想上限约 960 字节/秒。","quiz":{"question":"8N1 中的 N 代表什么？","options":["无校验","不发送换行","无数据"],"answer":0,"explanation":"N = No parity，表示无校验位。它与协议是否需要换行没有关系。"},"number":"14"},{"id":"pyserial","group":"serial","title":"pyserial：先跑通收发","time":"6 分钟","mode":"guide","example":"serial_loopback.py","summary":"先用 loop:// 自发自收，确认字节处理没问题，再换成真实 COM 口。","description":"这个程序不用硬件。pyserial 内置的 loop:// 会把写入的数据读回来，适合验证编码、超时和结束符。","points":["Serial('COM3', 9600, timeout=...) 打开真实串口；serial_for_url('loop://', ...) 创建软件回环。","write() 接收 bytes。read(size) / read_until(...) 可能因超时只读到部分数据，空数据也不一定是错误。","with 会关闭串口；捕获 SerialException 可以报告打开失败、断开或写入超时等串口错误。"],"guides":[["import serial","安装名是 pyserial，导入名是 serial。"],["with serial.serial_for_url","loop:// 是 pyserial 的软件回环，不需要设备，也不能填进 QSerialPort。"],["timeout=0.5","读取最多等约半秒。write_timeout 为写入也设置超时。"],["port.write","发送的是带 LF 的字节。write 的返回值是本次接受的字节数量。"],["received =","最多读到 LF 或超时；真实设备里仍需根据协议处理不完整结果。"],["except serial.SerialException","把串口异常显示出来；with 负责释放端口资源。"]],"expected":"发送的字节数：7\n收到：b'LED ON\\n'\nHEX：4C 45 44 20 4F 4E 0A","tip":"pyserial 的 timeout 默认是 None，会一直等。不要把这种阻塞读取直接放在 PyQt 主线程里。GUI 简单项目可以先用下一节的 QSerialPort。","extraCode":"from serial.tools import list_ports\n\nfor port in list_ports.comports():\n    print(port.device, port.description)\n# 真实串口示例（COM3 请换成实际端口）：\n# with serial.Serial(\"COM3\", 9600, timeout=0.1,\n#                    write_timeout=0.5) as port:\n#     port.write(b\"LED ON\\n\")\n","extraTitle":"枚举真实端口，再替换软件回环","quiz":{"question":"read_until() 返回空 bytes，能直接断定串口坏了吗？","options":["能","不能，也可能只是本次等待超时","表示收到字符 0"],"answer":1,"explanation":"在设置了 timeout 的情况下，没有数据到达也可能返回 b''。还需要检查连接状态和设备协议。"},"number":"15","filename":"serial_loopback.py","code":"\"\"\"不用硬件的 pyserial 回环。先安装：python -m pip install pyserial。\"\"\"\n\nimport serial\n\n\ndef main():\n    try:\n        with serial.serial_for_url(\n            \"loop://\", baudrate=9600,\n            timeout=0.5, write_timeout=0.5,\n        ) as port:\n            sent = port.write(b\"LED ON\\n\")\n            print(\"发送的字节数：\", sent, sep=\"\")\n            received = port.read_until(b\"\\n\", size=256)\n            print(\"收到：\", repr(received), sep=\"\")\n            print(\"HEX：\", received.hex(\" \").upper(), sep=\"\")\n    except serial.SerialException as error:\n        print(\"串口错误：\", error)\n        return 1\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n","guideSteps":[{"line":3,"note":"安装名是 pyserial，导入名是 serial。"},{"line":8,"note":"loop:// 是 pyserial 的软件回环，不需要设备，也不能填进 QSerialPort。"},{"line":10,"note":"读取最多等约半秒。write_timeout 为写入也设置超时。"},{"line":12,"note":"发送的是带 LF 的字节。write 的返回值是本次接受的字节数量。"},{"line":14,"note":"最多读到 LF 或超时；真实设备里仍需根据协议处理不完整结果。"},{"line":17,"note":"把串口异常显示出来；with 负责释放端口资源。"}]},{"id":"qserialport","group":"serial","title":"QSerialPort：与 PyQt 配合","time":"7 分钟","mode":"guide","example":"qserialport_minimal.py","summary":"有数据时发出 readyRead 信号，用短小的槽函数读取。","description":"Qt 自带的串口类很适合 PyQt 界面。示例用命令行指定端口，打开后发送一次 LED ON，并按换行提取回复。","points":["从 PyQt6.QtSerialPort 导入 QSerialPort / QSerialPortInfo，正常安装 PyQt6 后即可使用。","readyRead 是有新数据可读的通知，readAll() 取走当前可读数据。","write() 通常先进入发送缓冲；返回字节数不代表设备已确认。设备确认需要应用协议回复。"],"guides":[["self.port =","QSerialPort 是 QObject，把它交给父对象管理。"],["self.port.readyRead","连接一次接收通知；有数据时再执行 receive。"],["if not self.port.open","必须检查打开结果，用 errorString() 获取原因。"],["self.port.write","write 先排队发送，不能据此宣称设备已经收到。"],["self.buffer.extend","把当前这一批字节加进缓冲，不急着认为它是一条完整消息。"],["while b\"\\n\"","只有发现结束符才提取一帧，剩余字节留待下次。"]],"expected":"先运行 python qserialport_minimal.py 查看可用端口。再运行 python qserialport_minimal.py COM3（替换实际端口），程序打开端口并等待设备回复，按 Ctrl+C 退出。","tip":"GUI 里不要 waitForReadyRead() 或 waitForBytesWritten() 阻塞等待。用 readyRead / bytesWritten 等信号；槽里只做短操作。","quiz":{"question":"readyRead 触发一次，就一定收到一条完整消息吗？","options":["一定完整","不一定，可能半条或多条","一定只有一个字节"],"answer":1,"explanation":"readyRead 只表示有新数据。消息边界由协议决定，例如 LF、固定长度或长度字段。"},"number":"16","filename":"qserialport_minimal.py","code":"\"\"\"python qserialport_minimal.py [端口]；不传端口时只列出设备。\"\"\"\n\nimport signal\nimport sys\n\nfrom PyQt6.QtCore import QCoreApplication, QIODevice, QObject, QTimer\nfrom PyQt6.QtSerialPort import QSerialPort, QSerialPortInfo\n\n\nclass Receiver(QObject):\n    def __init__(self, name):\n        super().__init__()\n        self.buffer = bytearray()\n        self.port = QSerialPort(self)\n        self.port.setPortName(name)\n        self.port.setBaudRate(9600)\n        self.port.setDataBits(QSerialPort.DataBits.Data8)\n        self.port.setParity(QSerialPort.Parity.NoParity)\n        self.port.setStopBits(QSerialPort.StopBits.OneStop)\n        self.port.setFlowControl(QSerialPort.FlowControl.NoFlowControl)\n        self.port.readyRead.connect(self.receive)\n        self.port.errorOccurred.connect(self.handle_error)\n\n    def open(self):\n        if not self.port.open(QIODevice.OpenModeFlag.ReadWrite):\n            print(\"打开失败：\", self.port.errorString())\n            return False\n        queued = self.port.write(b\"LED ON\\n\")\n        if queued \u003c 0:\n            print(\"写入失败：\", self.port.errorString())\n            self.port.close()\n            return False\n        print(f\"已加入发送队列 {queued} 字节，等待设备回复；Ctrl+C 退出\")\n        return True\n\n    def receive(self):\n        self.buffer.extend(bytes(self.port.readAll()))\n        while b\"\\n\" in self.buffer:\n            end = self.buffer.index(b\"\\n\")\n            frame = bytes(self.buffer[:end]).removesuffix(b\"\\r\")\n            del self.buffer[:end + 1]\n            try:\n                print(\"收到：\", frame.decode(\"utf-8\"))\n            except UnicodeDecodeError:\n                print(\"非 UTF-8 帧，HEX：\", frame.hex(\" \").upper())\n        if len(self.buffer) > 4096:\n            print(\"超过 4096 字节仍无 LF，清空缓冲；请检查协议\")\n            self.buffer.clear()\n\n    def handle_error(self, error):\n        if error in (\n            QSerialPort.SerialPortError.ResourceError,\n            QSerialPort.SerialPortError.ReadError,\n            QSerialPort.SerialPortError.WriteError,\n        ):\n            print(\"串口错误：\", self.port.errorString())\n            self.port.close()\n            QCoreApplication.exit(1)\n\n\ndef main():\n    app = QCoreApplication(sys.argv)\n    if len(sys.argv) \u003c 2:\n        ports = QSerialPortInfo.availablePorts()\n        for info in ports:\n            print(info.portName(), info.description())\n        if not ports:\n            print(\"未发现可用端口。插入设备后再试。\")\n        print(\"用法：python qserialport_minimal.py COM3（替换实际端口）\")\n        return 0\n    receiver = Receiver(sys.argv[1])\n    if not receiver.open():\n        return 1\n    app.aboutToQuit.connect(receiver.port.close)\n    # 定期回到 Python，让 Ctrl+C 能被处理。\n    interrupt_timer = QTimer()\n    interrupt_timer.timeout.connect(lambda: None)\n    interrupt_timer.start(100)\n    signal.signal(signal.SIGINT, lambda *_: app.quit())\n    return app.exec()\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n","guideSteps":[{"line":14,"note":"QSerialPort 是 QObject，把它交给父对象管理。"},{"line":21,"note":"连接一次接收通知；有数据时再执行 receive。"},{"line":25,"note":"必须检查打开结果，用 errorString() 获取原因。"},{"line":28,"note":"write 先排队发送，不能据此宣称设备已经收到。"},{"line":37,"note":"把当前这一批字节加进缓冲，不急着认为它是一条完整消息。"},{"line":38,"note":"只有发现结束符才提取一帧，剩余字节留待下次。"}]},{"id":"frames","group":"serial","title":"缓冲区、分包与粘包","time":"7 分钟","mode":"trace","summary":"收到一块先存起来，够一条再取出来，剩下的留给下一次。","description":"假设协议以 LF（0A）结尾。把两条回复故意拆成三批，看看同一套接收逻辑如何应对。","points":["分包：一条消息分几次到达；粘包：几条消息一次到达。两者都是正常现象。","用 bytearray 累积字节，while 循环提取当前所有完整帧。","先分帧再 decode，可以避免一个 UTF-8 汉字被切开时解码失败。"],"code":"buffer = bytearray()\nchunks = [b\"TEMP=2\", b\"5\\nLED=O\", b\"N\\n\"]\nfor chunk in chunks:\n    buffer.extend(chunk)\n    while b\"\\n\" in buffer:\n        end = buffer.index(b\"\\n\")\n        frame = bytes(buffer[:end])\n        del buffer[:end + 1]\n        print(frame.decode(\"utf-8\"))\nprint(\"剩余字节：\", len(buffer))\n","notes":{"2":"模拟三次接收事件。第 1 批只有半条温度数据。","4":"追加新数据，保留上一次没有收完的部分。","5":"没有 LF 就等下次；有 LF 就进入循环。一次可能提取多条。","7":"不含 LF 的部分才是本条消息内容。","8":"把已处理的内容和结束符一起删除，保留后面的半包。","9":"完整帧已经拿到，这时才按协议编码解码。"},"tip":"这里只演示「按 LF 分帧」协议。二进制数据可能含 0A，需要按设备定义的帧头、长度、校验处理。真实应用还应限制缓冲区大小并处理异常长帧。","extraCode":"import struct\n\n# 假设协议规定：小端、无符号 16 位整数，单位为 0.1 °C。\npayload = bytes.fromhex(\"FA 00\")\nraw_value = struct.unpack(\"\u003cH\", payload)[0]\ntemperature = raw_value / 10\nprint(temperature)  # 25.0\n# \u003c 表示小端，H 表示无符号 16 位。必须以设备协议为准。\n","extraTitle":"了解即可：二进制数值用 struct 解包","quiz":{"question":"收到 b'TEMP=2' 但还没收到 LF，应该怎么办？","options":["立即当成完整温度值","丢掉这批数据","放进缓冲区，等待后续字节"],"answer":2,"explanation":"它可能只是 TEMP=25\\n 的前半部分。等到协议规定的边界出现，再处理。"},"number":"17","filename":"frames.py","states":[{"line":1,"scope":"模块","vars":[],"output":"","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":2,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'')"}],"output":"","note":"模拟三次接收事件。第 1 批只有半条温度数据。"},{"line":3,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b n']"},{"name":"chunk","type":"bytes","value":"b'5\\nLED=O'"},{"name":"end","type":"int","value":"7"}],"output":"","note":"不含 LF 的部分才是本条消息内容。"},{"line":8,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'TEMP=25\\nLED=O')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'5\\nLED=O'"},{"name":"end","type":"int","value":"7"},{"name":"frame","type":"bytes","value":"b'TEMP=25'"}],"output":"","note":"把已处理的内容和结束符一起删除，保留后面的半包。"},{"line":9,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'LED=O')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'5\\nLED=O'"},{"name":"end","type":"int","value":"7"},{"name":"frame","type":"bytes","value":"b'TEMP=25'"}],"output":"","note":"完整帧已经拿到，这时才按协议编码解码。"},{"line":5,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'LED=O')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'5\\nLED=O'"},{"name":"end","type":"int","value":"7"},{"name":"frame","type":"bytes","value":"b'TEMP=25'"}],"output":"TEMP=25\n","note":"没有 LF 就等下次；有 LF 就进入循环。一次可能提取多条。"},{"line":3,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'LED=O')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'5\\nLED=O'"},{"name":"end","type":"int","value":"7"},{"name":"frame","type":"bytes","value":"b'TEMP=25'"}],"output":"TEMP=25\n","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":4,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'LED=O')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'N\\n'"},{"name":"end","type":"int","value":"7"},{"name":"frame","type":"bytes","value":"b'TEMP=25'"}],"output":"TEMP=25\n","note":"追加新数据，保留上一次没有收完的部分。"},{"line":5,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'LED=ON\\n')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'N\\n'"},{"name":"end","type":"int","value":"7"},{"name":"frame","type":"bytes","value":"b'TEMP=25'"}],"output":"TEMP=25\n","note":"没有 LF 就等下次；有 LF 就进入循环。一次可能提取多条。"},{"line":6,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'LED=ON\\n')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'N\\n'"},{"name":"end","type":"int","value":"7"},{"name":"frame","type":"bytes","value":"b'TEMP=25'"}],"output":"TEMP=25\n","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":7,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'LED=ON\\n')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'N\\n'"},{"name":"end","type":"int","value":"6"},{"name":"frame","type":"bytes","value":"b'TEMP=25'"}],"output":"TEMP=25\n","note":"不含 LF 的部分才是本条消息内容。"},{"line":8,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'LED=ON\\n')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'N\\n'"},{"name":"end","type":"int","value":"6"},{"name":"frame","type":"bytes","value":"b'LED=ON'"}],"output":"TEMP=25\n","note":"把已处理的内容和结束符一起删除，保留后面的半包。"},{"line":9,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'N\\n'"},{"name":"end","type":"int","value":"6"},{"name":"frame","type":"bytes","value":"b'LED=ON'"}],"output":"TEMP=25\n","note":"完整帧已经拿到，这时才按协议编码解码。"},{"line":5,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'N\\n'"},{"name":"end","type":"int","value":"6"},{"name":"frame","type":"bytes","value":"b'LED=ON'"}],"output":"TEMP=25\nLED=ON\n","note":"没有 LF 就等下次；有 LF 就进入循环。一次可能提取多条。"},{"line":3,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'N\\n'"},{"name":"end","type":"int","value":"6"},{"name":"frame","type":"bytes","value":"b'LED=ON'"}],"output":"TEMP=25\nLED=ON\n","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":10,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'N\\n'"},{"name":"end","type":"int","value":"6"},{"name":"frame","type":"bytes","value":"b'LED=ON'"}],"output":"TEMP=25\nLED=ON\n","note":"高亮行还未执行。点下一步后，观察变量或输出有什么变化。"},{"line":null,"scope":"模块","vars":[{"name":"buffer","type":"bytearray","value":"bytearray(b'')"},{"name":"chunks","type":"list","value":"[b'TEMP=2', b'5\\nLED=O', b'N\\n']"},{"name":"chunk","type":"bytes","value":"b'N\\n'"},{"name":"end","type":"int","value":"6"},{"name":"frame","type":"bytes","value":"b'LED=ON'"}],"output":"TEMP=25\nLED=ON\n剩余字节： 0\n","note":"执行完成。可以回到任意一步查看状态，或下载代码，在本机修改后运行。"}]},{"id":"serial-lab","group":"practice","title":"串口收发实验台","time":"8 分钟","mode":"lab","summary":"亲手发一条命令，观察文字怎样变成字节，回复怎样拼成一帧。","description":"这是浏览器里的模拟设备，无需硬件。它使用 UTF-8 文本协议，以 LF 结束，支持 LED ON、LED OFF 和 TEMP?。","points":["先连接模拟设备，再发送命令。TX 表示发送，RX 表示接收。","文本模式会做 UTF-8 编码；HEX 模式把十六进制直接转为字节。","启用「拆分回复」后，点击接收下一批，观察缓冲区怎样保留半包。"],"tip":"本实验台不会访问真实串口。要操作实际 COM 口，请使用下一节下载的 PyQt 小工具。模拟设备的命令是教学约定，不代表你的设备也支持这些命令。","quiz":{"question":"文本模式发送 LED ON 并附加 LF，最后一个字节是什么？","options":["0A","0D","00"],"answer":0,"explanation":"LF 是换行，十六进制为 0A；CR 是回车，为 0D。CRLF 则是 0D 0A 两个字节。"},"number":"18"},{"id":"project","group":"practice","title":"完整项目：串口小工具","time":"15 分钟","mode":"project","example":"serial_assistant.py","summary":"把界面、信号、字节转换和接收缓冲区组合成一个能运行的小工具。","description":"默认选择模拟设备，安装 PyQt6 后就能运行。准备好硬件后，从下拉框选择真实端口，按设备协议调整参数与命令。","points":["界面：端口、波特率、连接状态、文本 / HEX 发送、结束符和接收日志。","通信：QSerialPort 的异步收发、接收缓冲、按 LF 分帧、断开清理。","练习：先在模拟模式发 TEMP?；再改标签或默认命令，最后连接你的设备。"],"tip":"这个教学项目固定为 8N1、无流控。文字帧按 UTF-8 + LF 解析，同时保留原始 HEX 日志。如果设备使用其他协议，先调整参数和分帧函数。","quiz":{"question":"把模拟设备切换成真实端口后，还需要确认什么？","options":["只需要端口名称","只需要窗口标题","串口参数、编码、命令格式与分帧规则"],"answer":2,"explanation":"端口打开成功仅代表建立了本机访问通道。设备是否理解你的命令取决于参数与协议。"},"number":"19","filename":"serial_assistant.py","code":"\"\"\"PyQt6 串口学习小工具。python serial_assistant.py 即可启动。\n\n默认模拟设备，不用硬件。真实端口固定使用 8N1 / 无流控。\n模拟协议：UTF-8 + LF，支持 LED ON、LED OFF、TEMP?。\n\"\"\"\n\nimport sys\n\nfrom PyQt6.QtCore import QIODevice, QTimer\nfrom PyQt6.QtSerialPort import QSerialPort, QSerialPortInfo\nfrom PyQt6.QtWidgets import (\n    QApplication, QWidget, QVBoxLayout, QHBoxLayout, QLabel,\n    QComboBox, QPushButton, QLineEdit, QPlainTextEdit,\n)\n\n\nclass LineBuffer:\n    \"\"\"按 LF 分帧；过长的一帧丢弃到下一个 LF，避免无限积累。\"\"\"\n\n    def __init__(self, limit=4096):\n        self.limit = limit\n        self.clear()\n\n    def clear(self):\n        self.data = bytearray()\n        self.dropping = False\n\n    def feed(self, data):\n        frames, dropped = [], 0\n        for value in data:\n            if value == 10:  # LF\n                if not self.dropping:\n                    frames.append(bytes(self.data).removesuffix(b\"\\r\"))\n                self.clear()\n            elif not self.dropping:\n                if len(self.data) \u003c self.limit:\n                    self.data.append(value)\n                else:\n                    self.data.clear()\n                    self.dropping = True\n                    dropped += 1\n        return frames, dropped\n\n\nclass SerialAssistant(QWidget):\n    def __init__(self):\n        super().__init__()\n        self.setWindowTitle(\"Python 串口学习小工具\")\n        self.resize(760, 520)\n        self.connected = False\n        self.simulated = True\n        self.led_on = False\n        self.rx_buffer = LineBuffer()\n        self.device_buffer = LineBuffer()\n        self.pending_reply = bytearray()\n\n        self.serial = QSerialPort(self)\n        self.serial.setReadBufferSize(8192)\n        self.serial.readyRead.connect(self.receive)\n        self.serial.errorOccurred.connect(self.handle_error)\n        self.reply_timer = QTimer(self)\n        self.reply_timer.setSingleShot(True)\n        self.reply_timer.timeout.connect(self.deliver_reply)\n\n        self.ports = QComboBox()\n        self.baud = QComboBox()\n        self.baud.addItems([\"9600\", \"19200\", \"38400\", \"57600\", \"115200\"])\n        self.refresh_button = QPushButton(\"刷新端口\")\n        self.connect_button = QPushButton(\"连接\")\n        self.status = QLabel(\"未连接 · 8N1 · 无流控\")\n        self.mode = QComboBox()\n        self.mode.addItems([\"文本 UTF-8\", \"HEX\"])\n        self.ending = QComboBox()\n        for label, data in ((\"LF (0A)\", b\"\\n\"), (\"CRLF (0D 0A)\", b\"\\r\\n\"), (\"无结束符\", b\"\")):\n            self.ending.addItem(label, data)\n        self.command = QLineEdit(\"LED ON\")\n        self.command.setMaxLength(1024)\n        self.command.setPlaceholderText(\"LED ON / LED OFF / TEMP?\")\n        self.send_button = QPushButton(\"发送\")\n        self.send_button.setEnabled(False)\n        self.log = QPlainTextEdit()\n        self.log.setReadOnly(True)\n        self.log.document().setMaximumBlockCount(500)\n        self.clear_button = QPushButton(\"清空日志\")\n\n        layout = QVBoxLayout(self)\n        layout.addWidget(QLabel(\"先用模拟设备练习，再选择真实端口。\"))\n        connection_row = QHBoxLayout()\n        for widget in (QLabel(\"端口\"), self.ports, QLabel(\"波特率\"), self.baud,\n                       self.refresh_button, self.connect_button):\n            connection_row.addWidget(widget)\n        layout.addLayout(connection_row)\n        layout.addWidget(self.status)\n        send_row = QHBoxLayout()\n        for widget in (self.mode, self.command, self.ending, self.send_button):\n            send_row.addWidget(widget)\n        layout.addLayout(send_row)\n        layout.addWidget(self.log)\n        layout.addWidget(self.clear_button)\n        layout.addWidget(QLabel(\"接收：原始 HEX + 按 LF 提取的 UTF-8 帧。实际命令请以设备协议为准。\"))\n\n        self.refresh_button.clicked.connect(self.refresh_ports)\n        self.connect_button.clicked.connect(self.toggle_connection)\n        self.send_button.clicked.connect(self.send)\n        self.command.returnPressed.connect(self.send)\n        self.clear_button.clicked.connect(self.log.clear)\n        self.refresh_ports()\n\n    def refresh_ports(self):\n        previous = self.ports.currentData()\n        self.ports.clear()\n        self.ports.addItem(\"模拟设备（无需硬件）\", None)\n        for info in QSerialPortInfo.availablePorts():\n            self.ports.addItem(f\"{info.portName()} · {info.description()}\", info.portName())\n        selected = self.ports.findData(previous)\n        self.ports.setCurrentIndex(max(0, selected))\n\n    def toggle_connection(self):\n        if self.connected:\n            self.disconnect()\n            return\n        name = self.ports.currentData()\n        self.simulated = name is None\n        if not self.simulated:\n            self.serial.setPortName(name)\n            self.serial.setBaudRate(int(self.baud.currentText()))\n            self.serial.setDataBits(QSerialPort.DataBits.Data8)\n            self.serial.setParity(QSerialPort.Parity.NoParity)\n            self.serial.setStopBits(QSerialPort.StopBits.OneStop)\n            self.serial.setFlowControl(QSerialPort.FlowControl.NoFlowControl)\n            if not self.serial.open(QIODevice.OpenModeFlag.ReadWrite):\n                self.log.appendPlainText(\"打开失败：\" + self.serial.errorString())\n                return\n        self.connected = True\n        self.rx_buffer.clear()\n        self.device_buffer.clear()\n        self.led_on = False\n        self.set_connection_ui()\n        self.log.appendPlainText(\"已连接：\" + (\"模拟设备\" if self.simulated else name))\n\n    def set_connection_ui(self):\n        for widget in (self.ports, self.baud, self.refresh_button):\n            widget.setEnabled(not self.connected)\n        self.send_button.setEnabled(self.connected)\n        self.connect_button.setText(\"断开\" if self.connected else \"连接\")\n        name = \"模拟设备\" if self.simulated else self.serial.portName()\n        state = f\"已连接 {name}\" if self.connected else \"未连接\"\n        self.status.setText(f\"{state} · {self.baud.currentText()} · 8N1 · 无流控\")\n\n    def disconnect(self):\n        self.connected = False\n        self.reply_timer.stop()\n        self.pending_reply.clear()\n        if self.serial.isOpen():\n            self.serial.close()\n        self.rx_buffer.clear()\n        self.device_buffer.clear()\n        self.set_connection_ui()\n        self.log.appendPlainText(\"已断开，接收缓冲区已清空\")\n\n    def send(self):\n        if not self.connected:\n            return\n        try:\n            text = self.command.text()\n            data = text.encode(\"utf-8\") if self.mode.currentIndex() == 0 else bytes.fromhex(text)\n            if not data:\n                self.log.appendPlainText(\"请输入要发送的内容\")\n                return\n            data += self.ending.currentData()\n        except ValueError:\n            self.log.appendPlainText(\"HEX 格式错误：请使用完整的两位字节，例如 AA 01 FF\")\n            return\n        if self.simulated:\n            self.simulate_device(data)\n        else:\n            if self.serial.bytesToWrite() > 8192:\n                self.log.appendPlainText(\"发送队列繁忙，请稍后再试\")\n                return\n            queued = self.serial.write(data)\n            if queued != len(data):\n                self.log.appendPlainText(f\"写入未完成：已排队 {max(queued, 0)} / {len(data)} 字节；请检查连接\")\n                return\n        self.log.appendPlainText(\"TX [已排队] \" + data.hex(\" \").upper())\n\n    def simulate_device(self, data):\n        frames, dropped = self.device_buffer.feed(data)\n        if dropped:\n            self.log.appendPlainText(\"模拟设备：命令过长，丢弃到下一换行\")\n        for frame in frames:\n            if frame == b\"LED ON\":\n                self.led_on = True\n                reply = b\"OK LED=ON\\n\"\n            elif frame == b\"LED OFF\":\n                self.led_on = False\n                reply = b\"OK LED=OFF\\n\"\n            elif frame == b\"TEMP?\":\n                reply = b\"TEMP=25.0\\n\"\n            else:\n                reply = b\"ERR UNKNOWN\\n\"\n            self.pending_reply.extend(reply)\n        if self.pending_reply and not self.reply_timer.isActive():\n            self.reply_timer.start(120)\n\n    def deliver_reply(self):\n        if self.connected and self.simulated:\n            data = bytes(self.pending_reply)\n            self.pending_reply.clear()\n            self.feed_received(data)\n\n    def receive(self):\n        self.feed_received(bytes(self.serial.readAll()))\n\n    def feed_received(self, data):\n        if not data:\n            return\n        self.log.appendPlainText(\"RX [原始] \" + data.hex(\" \").upper())\n        frames, dropped = self.rx_buffer.feed(data)\n        if dropped:\n            self.log.appendPlainText(\"接收帧过长，已丢弃；请检查 LF 分帧协议\")\n        for frame in frames:\n            try:\n                text = frame.decode(\"utf-8\")\n            except UnicodeDecodeError:\n                text = \"[非 UTF-8 帧，请查看原始 HEX]\"\n            self.log.appendPlainText(\"RX [完整帧] \" + text)\n\n    def handle_error(self, error):\n        if error == QSerialPort.SerialPortError.NoError or not self.connected:\n            return\n        self.log.appendPlainText(\"串口错误：\" + self.serial.errorString())\n        if error in (\n            QSerialPort.SerialPortError.ResourceError,\n            QSerialPort.SerialPortError.ReadError,\n            QSerialPort.SerialPortError.WriteError,\n        ):\n            self.disconnect()\n\n    def closeEvent(self, event):\n        self.disconnect()\n        event.accept()\n\n\nif __name__ == \"__main__\":\n    app = QApplication(sys.argv)\n    window = SerialAssistant()\n    window.show()\n    sys.exit(app.exec())\n"},{"id":"reference","group":"practice","title":"常见问题与速查","time":"随用随查","mode":"reference","summary":"出问题时先看现象，再沿着「环境 → 端口 → 字节 → 协议 → 界面」排查。","description":"不必一次记住所有 API。能找到错误发生在哪一层，就已经走对了一半。","points":["先让最小示例跑起来，再一点点加入自己的功能。","优先看异常原文和原始 HEX，避免只凭「没反应」猜问题。","同一个端口测试完及时关闭，避免与其他串口助手互相占用。"],"tip":"读完不等于会用：试着独立完成「点按钮 → 读输入 → 编码 → 发送 → 缓冲 → 解码 → 更新标签」这一条链路。","number":"20"}],"bundle":"UEsDBBQAAAAIAAAAIVwQV9cppwAAADMBAAAYAAAAcHl0aG9uLWV4YW1wbGVzL2J5dGVzLnB5dY5BCsIwEEX3Qu8QZpUuDLpz4yKgXYleQJDYTmmhJiGZYnskb+CJPIdJqRWUbv978B9hR2zL4LDfsdPxrCFZWNU3RhVhpQAF6twUyKGlcrmBNFk49GQcRmFURYG/jroHfO0JvSiduVXYcZCSrdYsy6KgfF7XFxrfpYTpZyBRyatao8fIX88H/IdYV2vin4bhgkEqWmvR8XQSQss8/HbMOw1qPsbE8Q1QSwMEFAAAAAgAAAAhXK1zXC1yAAAA1QAAABoAAABweXRob24tZXhhbXBsZXMvY2xhc3Nlcy5weX2NwQqAIBBE74L/sEejiLoGnfoQEV1BEAvX+v40g6hDc5vZN7PaKyJY1j0kjBNnkGXQgpQuuCSlIPS2uQ9FxfeH8jvCDANnT0UZ80e3M4wFty5Syt37p2g4I9RrMO/swvqy+TVbdCGJGl3THdSB6jJxAlBLAwQUAAAACAAAACFcteTx390AAAAlAQAAGQAAAHB5dGhvbi1leGFtcGxlcy9lcnJvcnMucHnLzC3ILypRyCrOz+Pl4uUqLU4tis/MKygtUbBVUEpMSlbi5SopqrTi5VIAgqTE0hSgeGZeiQZCoSYvV2pFcmpBiUJYYk5pqmtRUX4RqnpLMwMDiEBBEUiv0ot9k5+2Ln2yo/fZjPXPpm55NnXD+z09z6bsfD5lBVixEtDM5Py8tMx0oO5qJZALlawUlJz9fY2VdBSUQMYC+SCqlperOLEsFWQLyAt6KaW5BcUaEL06Cql5xaVFqfGJxcmZmbZuiTnFqUCDc/ITUxAaQLxiDbAZQDmI+yAqoiH2xAKFAVBLAwQUAAAACAAAACFc4rOVpnoAAADMAAAAFwAAAHB5dGhvbi1leGFtcGxlcy9mbG93LnB5K0vMKU0tVrBViDYy1lEwNtRRMLKI5eVKzEksygUJG/BypeUXKZSBlClk5kEYxVa8XApAkJkGlbBTMDaAioEAVLe2rYIhQrCgKDOvREPpWdfSF2uXKelAdGpC5FNzilOtMJWuXfx0xw4kpShGPFuz8NnUDUBZiG1AaQBQSwMEFAAAAAgAAAAhXNCLfIXYAAAAQAEAABkAAABweXRob24tZXhhbXBsZXMvZnJhbWVzLnB5SypNS0stUrBVSKosSU0sKkqs1NDk5UrOKM3LLgaKRicphbj6BtgaKekoJCmZxuT5uLrY+oM5fjF5SrG8XGn5RQpg5QqZ   let traceActions = null;

  function setupTrace(lesson) {

      document.getElementById('run-status').textContent = atBreakpoint ? `停在断点 · L${frame.line}` : state.index === last ? '已完成' : playing ? '回放中' : state.index === 0 ? '准备就绪' : '已暂停';
      const play = main.querySelector('[data-action="play"]');

      play.disabled = state.index === last;

    function stop() { clearInterval(timer); timer = null; playing = false; }
    function move(index) { stop(); atBreakpoint = false; state.index = Math.max(0, Math.min(last, index)); paint(); }
    traceActions = {
      step: () => move(state.index + 1),
      back: () => move(state.index - 1),
      reset: () => move(0),
      play: () => {

        if (state.index >= last) return;
        playing = true;
        atBreakpoint = false;

          state.index = Math.min(last, state.index + 1);
          if (state.breakpoints.has(states[state.index].line)) { atBreakpoint = true; stop(); }
          if (state.index === last) stop();
          paint();

  class LineBuffer {
    constructor(limit = 4096) { this.limit = limit; this.clear(); }
    clear() { this.data = []; this.dropping = false; }
    feed(chunk) {
      const frames = [];
      let dropped = 0;
      for (const byte of chunk) {
        if (byte === 10) {
          if (!this.dropping) {
            const frame = [...this.data];
            if (frame.at(-1) === 13) frame.pop();
            frames.push(Uint8Array.from(frame));
          }
          this.clear();
        } else if (!this.dropping) {
          if (this.data.length < this.limit) this.data.push(byte);
          else { this.data = []; this.dropping = true; dropped += 1; }
        }
      }
      return {frames, dropped};
    }
  }
  function setupLab() {
    const encoder = new TextEncoder();
    const decoder = new TextDecoder('utf-8', {fatal:true});
    const deviceBuffer = new LineBuffer();
    const receiveBuffer = new LineBuffer();
    const state = {connected:false, led:false, tx:0, rx:0, pending:[], frames:[], log:[]};
    const element = id => document.getElementById(id);
    const hex = bytes => [...bytes].map(value => value.toString(16).padStart(2, '0').toUpperCase()).join(' ');
    function addLog(kind, message) {
      state.log.push({kind, message});
      if (state.log.length > 120) state.log.shift();
    }
    function payload() {
      const text = element('lab-command').value;
      let bytes;
      if (element('lab-mode').value === 'hex') {
        const trimmed = text.trim();
        if (!trimmed) return new Uint8Array();
        if (!/^(?:[0-9a-fA-F]{2}\s*)+$/.test(trimmed)) throw new Error('HEX 需要完整的两位字节，例如 AA 01 FF；不能只写 A，也不能加 0x。');
        bytes = Uint8Array.from(trimmed.replace(/\s/g, '').match(/../g), pair => parseInt(pair, 16));
      } else { bytes = encoder.encode(text); }
      if (!bytes.length) return bytes;
      const ending = {lf:[10], crlf:[13,10], none:[]}[element('lab-ending').value];
      if (bytes.length + ending.length > 4096) throw new Error('本实验每次最多发送 4096 字节，请缩短输入。');
      return Uint8Array.from([...bytes, ...ending]);
    }
    function preview() {
      try {
        const bytes = payload();
        element('lab-hex').textContent = bytes.length ? hex(bytes) : '输入内容后查看字节';
        element('lab-byte-count').textContent = bytes.length ? `· ${bytes.length} B` : '';
        element('lab-error').textContent = '';
        element('lab-command').removeAttribute('aria-invalid');
      } catch (error) {
        element('lab-hex').textContent = '请先修正输入';
        element('lab-byte-count').textContent = '';
        element('lab-error').textContent = error.message;
        element('lab-command').setAttribute('aria-invalid', 'true');
      }
    }
    function paint() {
      main.querySelector('[data-action="lab-connect"]').textContent = state.connected ? '断开设备' : '连接设备';
      main.querySelector('[data-action="lab-send"]').disabled = !state.connected;
      main.querySelector('[data-action="lab-receive"]').disabled = !state.connected || !state.pending.length;
      element('lab-port').disabled = state.connected;
      element('lab-baud').disabled = state.connected;
      element('lab-status').textContent = state.connected ? `已连接 SIM1 · ${element('lab-baud').value}` : '未连接';
      element('lab-connection').classList.toggle('connected', state.connected);
      element('device-led').classList.toggle('on', state.led);
      element('device-led-text').textContent = state.led ? 'ON' : 'OFF';
      element('rx-buffer').textContent = receiveBuffer.data.length ? hex(receiveBuffer.data) : receiveBuffer.dropping ? '当前帧过长，等待 LF 后恢复' : '（空）';
      element('pending-count').textContent = state.pending.length ? `还有 ${state.pending.length} 批待接收` : '没有待接收数据';
      element('rx-frames').textContent = state.frames.length ? state.frames.join('\n') : '等待带 LF 的完整回复…';
      element('lab-counts').textContent = `TX ${state.tx} B / RX ${state.rx} B`;
      element('lab-log').innerHTML = state.log.map(entry => `<div class="${entry.kind}">${escape(entry.message)}</div>`).join('');
      element('lab-log').scrollTop = element('lab-log').scrollHeight;
    }
    function receiveNext() {
      if (!state.connected || !state.pending.length) return;
      const chunk = state.pending.shift();
      state.rx += chunk.length;
      addLog('rx', `RX ${String(chunk.length).padStart(3)} B  ${hex(chunk)}`);
      const result = receiveBuffer.feed(chunk);
      if (result.dropped) addLog('error', '接收帧过长，丢弃到下一个 LF');
      for (const frame of result.frames) {
        let text;
        try { text = decoder.decode(frame); }
        catch (_) { text = `[非 UTF-8 帧] ${hex(frame)}`; }
        state.frames.push(text);
        if (state.frames.length > 20) state.frames.shift();
        addLog('rx', `帧已完整  ${text}`);
      }
      if (receiveBuffer.data.length) addLog('', `缓冲 ${receiveBuffer.data.length} B，还没有 LF，先等待后续字节。`);
      paint();
    }
    function drain() { while (state.pending.length) receiveNext(); }
    function send() {
      if (!state.connected) return;
      let bytes;
      try {
        bytes = payload();
        if (!bytes.length) throw new Error('请输入要发送的内容。');
      } catch (error) { element('lab-error').textContent = error.message; return; }
      element('lab-error').textContent = '';
      state.tx += bytes.length;
      addLog('tx', `TX ${String(bytes.length).padStart(3)} B  ${hex(bytes)}`);
      const parsed = deviceBuffer.feed(bytes);
      if (parsed.dropped) addLog('error', '模拟设备：命令超过长度限制，等待下一换行恢复');
      const replies = [];
      for (const frame of parsed.frames) {
        let command;
        try { command = decoder.decode(frame); }
        catch (_) { command = ''; }
        let reply;
        if (command === 'LED ON') { state.led = true; reply = 'OK LED=ON\n'; }
        else if (command === 'LED OFF') { state.led = false; reply = 'OK LED=OFF\n'; }
        else if (command === 'TEMP?') reply = 'TEMP=25.0\n';
        else reply = 'ERR UNKNOWN\n';
        replies.push(...encoder.encode(reply));
      }
      if (deviceBuffer.data.length) {
        element('device-hint').textContent = `设备暂存了 ${deviceBuffer.data.length} 字节，正在等 LF。后续字节会接在它后面。`;
        addLog('', '设备仍在等 LF；没有完整命令就不会回复。重置实验可以清掉这段半包。');
      } else {
        element('device-hint').textContent = parsed.frames.length ? `设备已处理 ${parsed.frames.length} 条完整命令。观察下方的主机接收过程。` : '设备等待完整命令。';
      }
      if (replies.length) {
        const hadPending = state.pending.length > 0;
        const reply = Uint8Array.from(replies);
        if (element('lab-split').checked) {
          const cut = Math.max(1, Math.floor(reply.length / 2));
          state.pending.push(reply.slice(0, cut), reply.slice(cut));
          if (!hadPending) receiveNext();
        } else { state.pending.push(reply); drain(); }
      }
      paint();
    }
    function connect() {
      state.connected = !state.connected;
      state.pending = [];
      receiveBuffer.clear();
      deviceBuffer.clear();
      if (state.connected) {
        state.led = false;
        element('device-hint').textContent = '模拟设备已就绪，试着发送 LED ON 或 TEMP?。';
        addLog('', `已连接 SIM1，${element('lab-baud').value} / 8N1 / 无流控（模拟）`);
      } else {
        state.led = false;
        element('device-hint').textContent = '已断开，半包和待接收队列已清空。';
        addLog('', '已断开，半包和待接收队列已清空。');
      }
      element('lab-error').textContent = '';
      paint();
    }
    for (const id of ['lab-mode', 'lab-ending', 'lab-command']) element(id).addEventListener('input', preview);
    element('lab-command').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.isComposing) send(); });
    element('lab-split').addEventListener('change', () => { if (!element('lab-split').checked && state.connected) drain(); });
    preview();
    paint();
    return {
      'lab-connect': connect,
      'lab-send': send,
      'lab-receive': receiveNext,
      'lab-clear': () => { state.log = []; paint(); },
      'lab-reset': () => { element('lab-root').outerHTML = labHtml(); lab = setupLab(); },
      preset: command => {
        element('lab-mode').value = 'text';
        element('lab-ending').value = 'lf';
        element('lab-command').value = command;
        preview();
      },
    };
  }

  main.addEventListener('click', event => {
    const lesson = byId.get(currentId);
    const action = event.target.closest('[data-action]')?.dataset.action;
    if (action) {
      if (action === 'copy-code') copyText(lesson.code);
      else if (action === 'download-code') download(lesson.filename, lesson.code);
      else if (action === 'copy-extra') copyText(lesson.extraCode);
      else if (action === 'download-extra') download(`${lesson.id}_extra.py`, lesson.extraCode);
      else if (action === 'download-bundle') downloadBundle();
      else if (action === 'complete') {
        completed.has(currentId) ? completed.delete(currentId) : completed.add(currentId);
        persist();
        renderNavigation();
        const button = main.querySelector('[data-action="complete"]');
        button.classList.toggle('success', completed.has(currentId));
        button.setAttribute('aria-pressed', String(completed.has(currentId)));
        button.innerHTML = icon('check') + (completed.has(currentId) ? ' 已学会，可取消标记' : ' 这节我学会了');
      } else if (lesson.mode === 'trace' && traceActions?.[action]) traceActions[action]();
      else if (lesson.mode === 'guide' && guideActions?.[action]) guideActions[action]();
      else if (lesson.mode === 'lab' && lab?.[action]) lab[action]();
      return;
    }
    const breakpoint = event.target.closest('[data-break]');
    if (breakpoint && traceActions) { traceActions.breakpoint(Number(breakpoint.dataset.break)); return; }
    const option = event.target.closest('[data-answer]');
    if (option) { answers[currentId] = Number(option.dataset.answer); updateQuiz(lesson); persist(); return; }
    const copy = event.target.closest('[data-copy-command]');
    if (copy) { copyText(copy.dataset.copyCommand); return; }
    const preset = event.target.closest('[data-preset]');
    if (preset && lab) lab.preset(preset.dataset.preset);
  });

  function locationLesson() {
    try {
      const id = decodeURIComponent(location.hash.slice(1));
      return byId.has(id) ? id : null;
    } catch (_) { return null; }
  }
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href^="#"]');
    if (!link || link.classList.contains('skip-link') || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    const id = link.getAttribute('href').slice(1);
    if (!byId.has(id)) return;
    event.preventDefault();
    if (location.hash === `#${id}`) renderLesson(id, true);
    else location.hash = id;
  });
  window.addEventListener('hashchange', () => renderLesson(locationLesson() || 'variables', true));
  window.addEventListener('keydown', event => {
    if (event.key === '/' && !event.ctrlKey && !event.metaKey && !event.altKey && !['INPUT', 'TEXTAREA', 'SELECT'].includes(event.target.tagName) && !event.target.isContentEditable) {
      event.preventDefault();
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('menu-toggle').setAttribute('aria-expanded', 'true');
      document.getElementById('menu-toggle').textContent = '收起目录';
      document.getElementById('search').focus();
    }
    if (event.key === 'Escape' && event.target.id === 'search') {
      event.target.value = '';
      renderNavigation();
      event.target.blur();
    }
  });
  const initial = locationLesson() || (byId.has(saved.last) ? saved.last : 'variables');
  setThemeButton();
  renderLesson(initial);
})();
</script>
</body>
</html>
