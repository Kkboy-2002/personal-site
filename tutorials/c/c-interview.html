<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C 面试考点手册</title>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#172029; --muted:#5D6B78; --line:#D3DAE1; --soft:#F5F7F9;
  --accent:#2F57C9; --accent-ink:#FFFFFF; --amber:rgba(245,197,66,.42); --red:#D33F49; --green:#1F8A4C;
  --code-bg:#F8FAFC; --kw:#7A3E9D; --str:#237A3F; --num:#B45309; --com:#7B8794; --pre:#0E7490;
  --term-bg:#10161C; --term-ink:#D7E0E8; --shadow:0 1px 2px rgba(23,32,41,.06),0 8px 24px -12px rgba(23,32,41,.18);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1419; --surface:#161C23; --ink:#E4EAF0; --muted:#90A0AE; --line:#263038; --soft:#1C242D;
  --accent:#7A9BFF; --accent-ink:#0F1419; --amber:rgba(245,197,66,.22); --red:#F0616A; --green:#4CC57E;
  --code-bg:#12181F; --kw:#C48BE0; --str:#7ED39A; --num:#F0A050; --com:#6E7C8A; --pre:#5CC3DB;
  --term-bg:#0A0E12; --term-ink:#D7E0E8; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#161C23; --ink:#E4EAF0; --muted:#90A0AE; --line:#263038; --soft:#1C242D;
  --accent:#7A9BFF; --accent-ink:#0F1419; --amber:rgba(245,197,66,.22); --red:#F0616A; --green:#4CC57E;
  --code-bg:#12181F; --kw:#C48BE0; --str:#7ED39A; --num:#F0A050; --com:#6E7C8A; --pre:#5CC3DB;
  --term-bg:#0A0E12; --term-ink:#D7E0E8; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-block:0 48px;padding-inline:20px}
code,pre,.code,.vars,.editor{font-family:"IBM Plex Mono",ui-monospace,Consolas,"SFMono-Regular",Menlo,monospace}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto}
.masthead{padding-block:36px 20px;border-bottom:1px solid var(--line);margin-bottom:24px;display:flex;flex-wrap:wrap;align-items:end;gap:12px 32px}
.masthead h1{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.masthead h1 small{display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:15px;color:var(--muted);letter-spacing:0;margin-top:8px}
.legend{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;margin-left:auto}
.legend b{font-weight:500;color:var(--ink)}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);vertical-align:middle;margin-right:5px}
.legend .bar{display:inline-block;width:14px;height:11px;background:var(--amber);vertical-align:middle;margin-right:5px;border-left:3px solid #E0A800}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;align-items:start}
nav{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
nav a{color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;border-left:2px solid transparent;display:flex;gap:8px;align-items:baseline;line-height:1.35}
nav a .nt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:.7;min-width:34px;white-space:nowrap}
nav a:hover{background:var(--soft);color:var(--ink)}
nav a.on{color:var(--ink);border-left-color:var(--accent);background:var(--soft);font-weight:500}
.topic{padding-block:28px;border-top:1px solid var(--line)}
.topic:first-child{border-top:0;padding-top:4px}
.topic header{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.topic h2{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:600;font-size:24px;margin:0;letter-spacing:-.005em}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;padding:2px 7px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:4px;white-space:nowrap}
.points{margin:0 0 14px;padding-left:1.2em;max-width:68ch;color:var(--ink)}
.points li{margin:3px 0}
.points code,.answer code{font-size:.9em;background:var(--soft);padding:1px 5px;border-radius:4px}
.answer{margin:14px 0 0;max-width:72ch;color:var(--muted);font-size:14px;padding-left:14px;border-left:3px solid var(--line)}
.answer strong{color:var(--ink);font-weight:600;margin-right:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}

.runner{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:14px}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--soft)}
.btn{font:inherit;font-size:13px;font-weight:500;padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,.gut:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.status{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.status.s-run{color:#9A6B00}
:root[data-theme="dark"] .status.s-run{color:#F2C14E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .status.s-run{color:#F2C14E}}
.status.s-done{color:var(--green)}
.status.s-err{color:var(--red)}
.code{background:var(--code-bg);font-size:13px;line-height:1.55;padding-block:8px;overflow-x:auto;max-height:440px;overflow-y:auto;font-variant-ligatures:none}
.ln{display:flex;min-width:max-content;padding-right:16px}
.gut{width:44px;flex:0 0 44px;text-align:right;padding-right:10px;color:var(--com);user-select:none;cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.gut:hover{color:var(--red)}
.ln.bp .gut::before{content:"";position:absolute;left:8px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--red)}
.src{white-space:pre;padding-left:8px;flex:1}
.ln.cur{background:var(--amber);box-shadow:inset 3px 0 0 #E0A800}
.ln.err{background:color-mix(in srgb,var(--red) 18%,transparent);box-shadow:inset 3px 0 0 var(--red)}
.c-kw{color:var(--kw);font-weight:500}.c-str{color:var(--str)}.c-num{color:var(--num)}.c-com{color:var(--com);font-style:italic}.c-pre{color:var(--pre)}
.editor{display:block;width:100%;min-height:300px;border:0;resize:vertical;font-size:13px;line-height:1.55;padding:10px 12px;background:var(--code-bg);color:var(--ink);tab-size:4}
.editor:focus{outline:2px solid var(--accent);outline-offset:-2px}
.side{display:flex;flex-direction:column}
.watch{flex:1;min-height:120px}
.ph{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:7px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ph .stack{text-transform:none;letter-spacing:0;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--accent)}
.vars{width:100%;border-collapse:collapse;font-size:12.5px}
.vars td{padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
.vars tr:last-child td{border-bottom:0}
.vars .vn{white-space:nowrap;font-weight:500}
.vars .vt{color:var(--muted);white-space:nowrap}
.vars small{display:block;font-size:10.5px;color:var(--com);font-weight:400}
.vars .vv{word-break:break-all;font-variant-numeric:tabular-nums}
.vars .empty{color:var(--muted);font-family:"IBM Plex Sans",sans-serif;padding:12px}
.term{border-top:1px solid var(--line);background:var(--term-bg);color:var(--term-ink)}
.term .ph{color:#8A98A6;border-bottom-color:#243040}
.out{margin:0;padding:10px 12px;font-size:13px;line-height:1.5;min-height:72px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.out:empty::before{content:"（尚无输出）";color:#5A6A7A}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);max-width:72ch}
@media (max-width:900px){.layout{grid-template-columns:1fr}nav{position:static;flex-direction:row;flex-wrap:wrap;gap:4px}nav a{border-left:0;border:1px solid var(--line)}nav a .nt{display:none}.runner{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<body>
<div class="wrap">
  <header class="masthead">
    <h1>C 语言高频面试考点<small>14 个考点，每个配一段可单步、可打断点的最小代码。模拟 64 位 Linux：int 4 字节，long 与指针 8 字节，小端。</small></h1>
    <div class="legend"><span><b>单步</b> 逐语句执行</span><span><span class="dot"></span><b>断点</b> 点击行号</span><span><span class="bar"></span><b>当前行</b> 尚未执行</span></div>
  </header>
  <div class="layout">
    <nav id="nav" aria-label="考点目录"></nav>
    <main id="topics"></main>
  </div>
  <p class="foot">代码在浏览器内由一个 C 子集解释器执行：支持指针、数组、结构体/联合、函数指针、递归、宏、malloc/free 与常用 printf 格式；地址是模拟值，与真实编译器略有差异。空指针解引用、double free、除零、死循环都会被拦截并提示。可点"编辑"改代码验证自己的猜想。</p>
</div>
<script>
/* ===== C 子集解释器：字节级内存模拟 + 生成器驱动（可单步 / 断点） ===== */
const CInterp = (() => {
const TYPEKW = new Set(['int','char','short','long','float','double','void','unsigned','signed','const','static','struct','union','typedef']);
const KW = new Set([...TYPEKW,'if','else','while','do','for','return','break','continue','sizeof']);
const PUNCT = ['<<=','>>=','->','++','--','<<','>>','<=','>=','==','!=','&&','||','+=','-=','*=','/=','%=','&=','|=','^=','...'];
const ESC = {n:'\n',t:'\t','0':'\0','\\':'\\',"'":"'",'"':'"',r:'\r'};
const enc = new TextEncoder(), dec = new TextDecoder();
class CError extends Error { constructor(m, line) { super(m); this.line = line; } }
const hex = a => '0x' + a.toString(16);

/* ---------- 词法 + 预处理 ---------- */
function tokenize(src, macros) {
  const toks = []; let i = 0, line = 1; const n = src.length;

    const c = src[i];
    if (c === '\n') { line++; i++; continue; }
    if (c === ' ' || c === '\t' || c === '\r') { i++; continue; }
    if (c === '/' && src[i+1] === '/') { while (i < n && src[i] !== '\n') i++; continue; }
    if (c === '/' && src[i+1] === '*') { i += 2; while (i < n && !(src[i] === '*' && src[i+1] === '/')) { if (src[i] === '\n') line++; i++; } i += 2; continue; }
    if (c === '#') {
      let j = i; while (j < n && src[j] !== '\n') j++;
      const ln = src.slice(i+1, j).trim(); i = j;
      const m = ln.match(/^define\s+(\w+)(\([^)]*\))?\s*(.*)$/);
      if (m && macros) { const params = m[2] ? m[2].slice(1,-1).split(',').map(s => s.trim()).filter(Boolean) : null; macros.set(m[1], {params, body: tokenize(m[3], null)}); }
      continue;
    }
    if (/[A-Za-z_]/.test(c)) { let j = i; while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++; const w = src.slice(i, j); i = j; push(KW.has(w) ? 'kw' : 'id', w); continue; }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i+1] || ''))) {
      let j = i;
      if (c === '0' && /[xX]/.test(src[i+1] || '')) { j += 2; while (/[0-9a-fA-F]/.test(src[j] || '')) j++; }
      else { while (/[0-9.]/.test(src[j] || '')) j++; if (/[eE]/.test(src[j] || '')) { j++; if (/[+-]/.test(src[j] || '')) j++; while (/[0-9]/.test(src[j] || '')) j++; } }
      const text = src.slice(i, j); let suf = ''; while (/[uUlLfF]/.test(src[j] || '')) { suf += src[j].toLowerCase(); j++; } i = j;
      push('num', {text, suf}); continue;
    }
    if (c === '"') { let j = i+1, s = ''; while (j < n && src[j] !== '"') { if (src[j] === '\\') { s += ESC[src[j+1]] ?? src[j+1]; j += 2; } else s += src[j++]; } i = j+1; push('str', s); continue; }
    if (c === "'") { let j = i+1, s; if (src[j] === '\\') { s = ESC[src[j+1]] ?? src[j+1]; j += 2; } else s = src[j++]; if (src[j] !== "'") throw new CError('字符常量未闭合', line); i = j+1; push('chr', s.charCodeAt(0)); continue; }

}
function expand(toks, macros) {
  const out = []; let i = 0, changed = false;
  while (i < toks.length) {
    const tk = toks[i];
    if (tk.t === 'id' && macros.has(tk.v)) {
      const m = macros.get(tk.v);
      if (!m.params) { out.push(...m.body.map(b => ({...b, line: tk.line}))); i++; changed = true; continue; }
      if (toks[i+1] && toks[i+1].v === '(') {
        let depth = 0, j = i+1; const args = []; let cur = [];
        for (;;) { j++; const a = toks[j]; if (!a) throw new CError('宏参数不完整', tk.line);
          if (a.v === '(') depth++;
          if (a.v === ')') { if (depth === 0) { if (cur.length || args.length) args.push(cur); break; } depth--; }
          if (a.v === ',' && depth === 0) { args.push(cur); cur = []; continue; }
          cur.push(a); }
        const map = new Map(m.params.map((p, k) => [p, args[k] || []]));
        for (const b of m.body) { if (b.t === 'id' && map.has(b.v)) out.push(...map.get(b.v).map(x => ({...x, line: tk.line}))); else out.push({...b, line: tk.line}); }
        i = j+1; changed = true; continue;
      }
    }
    out.push(tk); i++;
  }
  return {out, changed};
}

/* ---------- 类型 ---------- */
const SZ = {char:1, short:2, int:4, long:8, float:4, double:8, ptr:8, void:1, fn:1};
const mk = (k, unsigned) => ({k, unsigned: !!unsigned});
const T = {int: mk('int'), char: mk('char'), long: mk('long'), ulong: mk('long', true), double: mk('double'), float: mk('float'), void: mk('void')};
const ptr = to => ({k: 'ptr', to});
function sizeOf(t) { if (t.k === 'arr') return t.n * sizeOf(t.of); if (t.k === 'struct') return t.size; return SZ[t.k]; }
function alignOf(t) { if (t.k === 'arr') return alignOf(t.of); if (t.k === 'struct') return t.align; return SZ[t.k]; }
function typeStr(t) {
  switch (t.k) {
    case 'ptr': return t.to.k === 'fn' ? 'fn *' : typeStr(t.to) + (t.to.k === 'ptr' ? '*' : ' *');
    case 'arr': return typeStr(t.of) + '[' + t.n + ']';
    case 'struct': return (t.union ? 'union ' : 'struct ') + t.name;
    case 'fn': return 'fn';
    default: return (t.unsigned ? 'unsigned ' : '') + t.k;
  }
}
function promote(t) { return (t.k === 'char' || t.k === 'short') ? T.int : t; }
function arith(a, b) {
  a = promote(a); b = promote(b);
  if (a.k === 'double' || b.k === 'double') return T.double;
  if (a.k === 'float' || b.k === 'float') return T.float;
  if (a.k === 'long' || b.k === 'long') return mk('long', (a.k === 'long' && a.unsigned) || (b.k === 'long' && b.unsigned));
  if (a.k === 'ptr' || b.k === 'ptr') return T.long;
  return mk('int', a.unsigned || b.unsigned);
}
function coerce(t, v) {
  switch (t.k) {
    case 'char': return t.unsigned ? v & 255 : (v << 24) >> 24;
    case 'short': return t.unsigned ? v & 65535 : (v << 16) >> 16;
    case 'int': return t.unsigned ? v >>> 0 : v | 0;
    case 'long': v = Math.trunc(v); return t.unsigned && v < 0 ? Number(BigInt.asUintN(64, BigInt(v))) : v;
    case 'float': return Math.fround(v);
    case 'double': return v;
    case 'ptr': return v >>> 0;
    default: return v;
  }
}
function parseNum({text, suf}) {
  let v, t;
  if (/^0[xX]/.test(text)) { v = parseInt(text, 16); t = 'int'; }
  else if (/[.eE]/.test(text)) { v = parseFloat(text); t = suf.includes('f') ? 'float' : 'double'; }
  else { v = parseInt(text, 10); t = 'int'; }
  if (t === 'int') { const u = suf.includes('u'), l = suf.includes('l') || v > 2147483647; t = mk(l ? 'long' : 'int', u); } else t = mk(t);
  return {v, t};
}
const truthy = v => v.v !== 0 && !Number.isNaN(v.v);

/* ---------- 语法分析 ---------- */
const BIN = [['||'],['&&'],['|'],['^'],['&'],['==','!='],['<','>','<=','>='],['<<','>>'],['+','-'],['*','/','%']];
class Parser {
  constructor(toks) {
    this.toks = toks; this.p = 0; this.structs = new Map();
    this.typedefs = new Map([['size_t', T.ulong], ['bool', T.char], ['int8_t', T.char], ['uint8_t', mk('char', true)], ['int16_t', mk('short')], ['uint16_t', mk('short', true)], ['int32_t', T.int], ['uint32_t', mk('int', true)], ['int64_t', T.long], ['uint64_t', T.ulong]]);
  }
  peek(o = 0) { return this.toks[this.p + o] || {t: 'eof', v: '文件末尾', line: (this.toks[this.toks.length-1] || {}).line || 1}; }
  next() { return this.toks[this.p++]; }
  is(v, o = 0) { const t = this.peek(o); return (t.t === 'op' || t.t === 'kw') && t.v === v; }
  eat(v) { if (this.is(v)) { this.p++; return true; } return false; }
  expect(v) { if (!this.eat(v)) { const t = this.peek(); throw new CError(`语法错误: 期望 '${v}'，遇到 '${t.v.text || t.v}'`, t.line); } }
  isTypeStart(o = 0) { const t = this.peek(o); return (t.t === 'kw' && TYPEKW.has(t.v)) || (t.t === 'id' && this.typedefs.has(t.v)); }

  typeSpec() {
    let u = false, base = null, isStatic = false, isTypedef = false, seen = false;
    for (;;) {
      const tk = this.peek();
      if (tk.t === 'kw' && TYPEKW.has(tk.v)) {
        seen = true;
        if (tk.v === 'struct' || tk.v === 'union') { this.next(); base = this.structSpec(tk.v === 'union'); continue; }
        if (tk.v === 'static') isStatic = true; else if (tk.v === 'typedef') isTypedef = true; else if (tk.v === 'unsigned') u = true;
        else if (tk.v === 'long') base = base === 'double' ? 'double' : 'long';
        else if (tk.v === 'int') { if (base !== 'long' && base !== 'short') base = 'int'; }
        else if (tk.v !== 'const' && tk.v !== 'signed') base = tk.v;
        this.next();
      } else if (tk.t === 'id' && this.typedefs.has(tk.v) && !base && !u) { seen = true; base = this.typedefs.get(tk.v); this.next(); }
      else break;

  }

    let name = null; if (this.peek().t === 'id') name = this.next().v;
    if (this.eat('{')) {

      if (!t) { t = {k: 'struct', name: name || '<匿名>', members: [], size: 0, align: 1, union}; if (name) this.structs.set(name, t); }
      let off = 0, al = 1;
      while (!this.eat('}')) {
        const ts = this.typeSpec(); if (!ts) throw new CError('结构体成员需要类型', this.peek().line);

           sizeof(struct A), sizeof(struct B), sizeof(struct C));
    struct A a = {'x', 7, 'y'};
    printf("&a.c=%p &a.i=%p &a.d=%p\\n", &a.c, &a.i, &a.d);
    return 0;
}`},
{id:'static', tag:'关键字', title:'static 局部变量', points:[
 'static 局部变量存在静态区，只初始化一次，函数返回后值仍然保留。',
 '普通局部变量在栈上，每次调用重新创建。',
 'static 修饰全局变量/函数时，含义变为"仅本文件可见"。'],
 answer:'答法：static 改变的是存储期（生命周期）和链接属性，作用域仍然在函数内。',
 code:`#include <stdio.h>
int counter(void) {
    static int n = 0;    // 只初始化一次，一直活到程序结束
    int m = 0;           // 每次调用都从 0 开始
    n++;
    m++;
    return n * 100 + m;
}
int main(void) {
    printf("%d\\n", counter());
    printf("%d\\n", counter());
    printf("%d\\n", counter());
    return 0;
}`},
{id:'unsigned', tag:'类型', title:'有符号 / 无符号陷阱', points:[
 'int 与 unsigned int 混合运算时，int 会被转成 unsigned，-1 变成 4294967295。',
 'unsigned char 255 + 1 回绕为 0；char 在多数平台有符号，128 存进去是 -128。',
 '循环 <code>for (unsigned i = n; i &gt;= 0; i--)</code> 永远不会停。'],
 answer:'答法：整型提升和"通常算术转换"是隐式的，比较大小前先想清楚两边的类型。',
 code:`#include <stdio.h>
int main(void) {
    int a = -1;
    unsigned int b = 1;
    if (a > b) printf("-1 > 1u 成立！a 被转成 %u\\n", a);
    else       printf("-1 < 1u\\n");
    unsigned char c = 255;
    c = c + 1;                      // 回绕
    printf("255 + 1 = %d\\n", c);
    char ch = 128;                  // 超出 char 范围
    printf("char 存 128 得到 %d\\n", ch);
    printf("sizeof: int=%zu long=%zu\\n", sizeof(int), sizeof(long));
    return 0;
}`},
{id:'bits', tag:'位运算', title:'位运算常考技巧', points:[
 '<code>n &amp; 1</code> 判奇偶；<code>n &amp; (n-1)</code> 消掉最低位的 1，为 0 说明 n 是 2 的幂。',
 '<code>n &amp; -n</code> 取最低位的 1；循环 <code>x &amp;= x-1</code> 数 1 的个数。',
 '异或交换不用临时变量，但两个变量是同一地址时会清零。'],
 answer:'答法：位运算题先把数写成二进制，再看每一步操作对位的影响。',
 code:`#include <stdio.h>
int main(void) {
    int n = 12;                                // 1100
    printf("奇偶: %s\\n", (n & 1) ? "奇" : "偶");
    printf("是 2 的幂: %d\\n", n > 0 && (n & (n - 1)) == 0);
    printf("最低位的 1: %d\\n", n & -n);
    int cnt = 0, x = n;
    while (x) { x &= x - 1; cnt++; }           // 数 1 的个数
    printf("二进制里 1 的个数: %d\\n", cnt);
    int a = 5, b = 9;
    a ^= b; b ^= a; a ^= b;                    // 异或交换
    printf("a=%d b=%d\\n", a, b);
    printf("n<<2=%d n>>1=%d ~n=%d\\n", n << 2, n >> 1, ~n);
    return 0;
}`},
{id:'fnptr', tag:'函数', title:'函数指针与回调', points:[
 '<code>int (*fp)(int, int)</code> 声明一个指向"两个 int 参数、返回 int"函数的指针。',
 '函数名本身就是地址，<code>fp = add</code> 与 <code>fp = &amp;add</code> 等价；调用时 <code>fp()</code> 与 <code>(*fp)()</code> 等价。',
 '回调 = 把函数指针当参数传给别人，由别人在合适时机调用（如 qsort 的比较函数）。'],
 answer:'答法：函数指针让"做什么"在运行时决定，是 C 里实现多态和回调的基本手段。',
 code:`#include <stdio.h>
int add(int a, int b) { return a + b; }
int mul(int a, int b) { return a * b; }
int apply(int (*op)(int, int), int x, int y) {   // 回调
    return op(x, y);
}
int main(void) {
    int (*fp)(int, int) = add;
    printf("fp(2,3)=%d (*fp)(2,3)=%d\\n", fp(2, 3), (*fp)(2, 3));
    fp = mul;
    printf("apply(mul,4,5)=%d\\n", apply(fp, 4, 5));
    int (*table[2])(int, int) = {add, mul};     // 函数指针数组
    printf("table: %d %d\\n", table[0](1, 2), table[1](3, 4));
    return 0;
}`},
{id:'heap', tag:'内存', title:'malloc / free 与堆', points:[
 '局部变量在栈上、函数返回即销毁；malloc 的内存在堆上，直到 free 才释放。',
 'malloc 可能失败返回 NULL，必须检查；free 后把指针置 NULL 防止悬空指针。',
 '<code>free(NULL)</code> 是安全的；同一块内存 free 两次（double free）是严重错误。'],
 answer:'答法：谁申请谁释放、申请必检查、释放必置空；泄漏和野指针是 C 里最常见的两类内存 bug。',
 code:`#include <stdio.h>
#include <stdlib.h>
int main(void) {
    int n = 4;
    int *arr = (int *)malloc(n * sizeof(int));   // 堆上分配
    if (arr == NULL) return 1;                   // 必须检查
    for (int i = 0; i < n; i++) arr[i] = i * i;
    for (int i = 0; i < n; i++) printf("%d ", arr[i]);
    printf("\\n堆地址 %p  栈地址 %p\\n", arr, &n);
    free(arr);
    arr = NULL;          // 防悬空；试试删掉这行再 free 一次
    free(arr);           // free(NULL) 安全
    return 0;
}`},
{id:'recur', tag:'函数', title:'递归与调用栈', points:[
 '每次调用都会压一个栈帧，保存自己的参数和局部变量；递归太深会栈溢出。',
 '递归必须有出口（基准条件），否则无限压栈。',
 '朴素 fib 是指数级重复计算，面试常追问怎么用循环或记忆化优化。'],
 answer:'答法：先说出口条件，再说递推关系，最后说栈深度和时间复杂度。单步看右侧调用栈的变化。',
 code:`#include <stdio.h>
int fact(int n) {
    if (n <= 1) return 1;        // 递归出口
    return n * fact(n - 1);      // 每一层在栈上保留自己的 n
}
int fib(int n) {
    return n < 2 ? n : fib(n - 1) + fib(n - 2);
}
int main(void) {
    printf("5! = %d\\n", fact(5));
    printf("fib(10) = %d\\n", fib(10));
    return 0;
}`},
{id:'macro', tag:'预处理', title:'宏陷阱与 ++i / i++', points:[
 '宏是纯文本替换，参数和整体都要加括号，否则优先级出错。',
 '宏参数出现几次就求值几次，传 <code>k++</code> 会自增多次。',
 '<code>i++</code> 先用旧值再加，<code>++i</code> 先加再用；同一表达式里多次修改同一变量是未定义行为。'],
 answer:'答法：宏没有类型检查、没有作用域、参数可能重复求值；能用 inline 函数就别用宏。',
 code:`#include <stdio.h>
#define SQUARE_BAD(x)  x * x
#define SQUARE(x)      ((x) * (x))
#define MAX(a, b)      ((a) > (b) ? (a) : (b))
int main(void) {
    int i = 3;
    printf("坏宏: %d\\n", SQUARE_BAD(i + 1));   // 3 + 1*3 + 1 = 7
    printf("好宏: %d\\n", SQUARE(i + 1));       // 16
    int k = 5;
    printf("MAX(k++,3)=%d ", MAX(k++, 3));     // k++ 被求值两次
    printf("k=%d\\n", k);
    int j = i++;         // 先用后加：j=3, i=4
    int m = ++i;         // 先加后用：m=5, i=5
    printf("j=%d m=%d i=%d\\n", j, m, i);
    return 0;
}`},
{id:'endian', tag:'内存', title:'大端与小端', points:[
 '小端：低字节放在低地址（x86 / ARM 默认）；大端：高字节放低地址（网络字节序）。',
 '判断方法：取 int 的首字节，或用 union 让 int 和 char 共享内存。',
 '网络传输前要用 htonl / htons 转成大端。'],
 answer:'答法：先说定义，再给一种代码判断法，最后提网络字节序是大端。',
 code:`#include <stdio.h>
int main(void) {
    int x = 0x12345678;
    unsigned char *p = (unsigned char *)&x;   // 按字节看
    printf("内存顺序: %02x %02x %02x %02x\\n", p[0], p[1], p[2], p[3]);
    if (p[0] == 0x78) printf("小端：低字节在低地址\\n");
    else              printf("大端：高字节在低地址\\n");
    union { int i; char c; } u;               // 共享同一块内存
    u.i = 1;
    printf("union 判断: %s\\n", u.c == 1 ? "小端" : "大端");
    return 0;
}`},
];

</script>
<script>
/* ===== 页面交互：渲染考点、代码、单步 / 断点 / 运行 ===== */
(function () {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const KW = /\b(int|char|short|long|float|double|void|unsigned|signed|const|static|struct|union|typedef|if|else|while|do|for|return|break|continue|sizeof|NULL)\b/g;
  function highlight(line) {
    let s = esc(line);
    if (/^\s*#/.test(s)) return `<span class="c-pre">${s}</span>`;
    const parts = []; let rest = s;
    // 先切出注释和字符串，避免其中的关键字被染色
    const re = /(\/\/.*$|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/;
    while (rest.length) {
      const m = rest.match(re);
      if (!m) { parts.push(plain(rest)); break; }
      parts.push(plain(rest.slice(0, m.index)));
      parts.push(m[0].startsWith('//') ? `<span class="c-com">${m[0]}</span>` : `<span class="c-str">${m[0]}</span>`);
      rest = rest.slice(m.index + m[0].length);
    }
    return parts.join('');
    function plain(t) { return t.replace(KW, '<span class="c-kw">$1</span>').replace(/\b(0x[0-9a-fA-F]+|\d+)\b/g, '<span class="c-num">$1</span>'); }
  }

  class Runner {
    constructor(ex, root) {
      this.ex = ex; this.root = root; this.code = ex.code; this.bp = new Set(); this.reset(false);
      this.build(); this.renderCode(); this.renderState();
    }
    q(sel) { return this.root.querySelector(sel); }
    build() {
      const id = this.ex.id;
      this.root.innerHTML = `
        <div class="pane code-pane">
          <div class="toolbar" role="toolbar" aria-label="调试控制">
            <button type="button" class="btn primary" data-act="run" id="run-${id}">▶ 运行</button>
            <button type="button" class="btn" data-act="step" id="step-${id}">单步</button>
            <button type="button" class="btn" data-act="reset" id="reset-${id}">重置</button>
            <button type="button" class="btn ghost" data-act="edit" id="edit-${id}">编辑</button>
            <span class="status" id="status-${id}">未开始 · 点击行号设断点</span>
          </div>
          <div class="code" id="code-${id}"></div>
          <textarea class="editor" id="editor-${id}" hidden spellcheck="false" aria-label="编辑 C 代码"></textarea>
        </div>
        <div class="pane side">
          <div class="watch">
            <div class="ph">变量 <span class="stack" id="stack-${id}"></span></div>
            <table class="vars" id="vars-${id}"><tbody></tbody></table>
          </div>
          <div class="term"><div class="ph">输出</div><pre id="out-${id}" class="out"></pre></div>
        </div>`;
      this.root.addEventListener('click', e => {
        const b = e.target.closest('[data-act]'); if (b) { this[b.dataset.act](); return; }
        const g = e.target.closest('.gut'); if (g) { const n = +g.dataset.line; if (this.bp.has(n)) this.bp.delete(n); else this.bp.add(n); this.renderCode(); }
      });
    }
    reset(render = true) {
      this.machine = null; this.gen = null; this.done = false; this.err = null; this.cur = null; this.hit = false;
      if (render) { this.renderCode(); this.renderState(); }
    }
    ensure() {
      if (this.gen || this.err) return;
      try { this.machine = CInterp.compile(this.code); this.gen = this.machine.run(); }
      catch (e) { this.err = e; this.done = true; }
    }
    advance() {
      try { const r = this.gen.next(); if (r.done) { this.done = true; this.cur = null; } else this.cur = r.value.line; }
      catch (e) { this.err = e; this.done = true; if (e.line) this.cur = e.line; }
    }
    step() { this.leaveEdit(); this.ensure(); this.hit = false; if (!this.done) this.advance(); this.renderCode(); this.renderState(); }
    run() {
      this.leaveEdit(); this.ensure(); this.hit = false;
      while (!this.done && !this.err) { this.advance(); if (this.cur !== null && this.bp.has(this.cur)) { this.hit = true; break; } }
      this.renderCode(); this.renderState();
    }
    edit() {
      const ta = this.q('.editor'), code = this.q('.code'), btn = this.q('[data-act=edit]');
      if (ta.hidden) { ta.value = this.code; ta.hidden = false; code.hidden = true; btn.textContent = '完成'; ta.focus(); }
      else this.leaveEdit();
    }
    leaveEdit() {
      const ta = this.q('.editor'); if (ta.hidden) return;
      const changed = ta.value !== this.code; this.code = ta.value; ta.hidden = true; this.q('.code').hidden = false; this.q('[data-act=edit]').textContent = '编辑';
      if (changed) this.reset(false);
    }
    renderCode() {
      const lines = this.code.split('\n');
      this.q('.code').innerHTML = lines.map((l, i) => {
        const n = i + 1; const cls = ['ln']; if (n === this.cur) cls.push(this.err ? 'err' : 'cur'); if (this.bp.has(n)) cls.push('bp');
        return `<div class="${cls.join(' ')}"><span class="gut" data-line="${n}" title="点击设置/取消断点">${n}</span><span class="src">${highlight(l) || ' '}</span></div>`;
      }).join('');
      const c = this.q('.ln.cur, .ln.err'); if (c && c.scrollIntoView) c.scrollIntoView({block: 'nearest'});
    }
    renderState() {
      const st = this.q('.status'), vars = this.q('.vars tbody'), out = this.q('.out'), stack = this.q('.stack');
      st.className = 'status';
      if (this.err) { st.textContent = `错误${this.err.line ? `（第 ${this.err.line} 行）` : ''}: ${this.err.message}`; st.classList.add('s-err'); }
      else if (!this.gen) st.textContent = '未开始 · 点击行号设断点';
      else if (this.done) { st.textContent = `已结束，main 返回 ${this.machine.exit ?? 0}`; st.classList.add('s-done'); }
      else { st.textContent = `${this.hit ? '断点命中，' : ''}停在第 ${this.cur} 行，尚未执行该行`; st.classList.add('s-run'); }
      if (!this.machine) { vars.innerHTML = '<tr><td class="empty" colspan="3">运行后这里显示当前函数的变量与地址</td></tr>'; out.textContent = ''; stack.textContent = ''; return; }
      const s = this.machine.snapshot();
      stack.textContent = s.stack.length ? '调用栈: ' + s.stack.map(f => f.fn).join(' → ') : '';
      const rows = [...s.vars.map(v => ({...v, scope: v.isStatic ? 'static' : ''})), ...s.globals.map(v => ({...v, scope: 'global'}))];
      vars.innerHTML = rows.length ? rows.map(v => `<tr><td class="vn">${esc(v.name)}${v.scope ? `<small>${v.scope}</small>` : ''}</td><td class="vt">${esc(v.type)}<small>${v.addr}</small></td><td class="vv">${esc(v.val)}</td></tr>`).join('')
        : '<tr><td class="empty" colspan="3">当前作用域没有变量</td></tr>';
      out.textContent = s.out; if (this.err && !/^程序调用 exit/.test(this.err.message)) out.textContent += (s.out.endsWith('\n') || !s.out ? '' : '\n') + `[程序异常终止: ${this.err.message}]`;
    }
  }

  const nav = document.getElementById('nav'), main = document.getElementById('topics');
  nav.innerHTML = EXAMPLES.map(e => `<a href="#${e.id}"><span class="nt">${e.tag}</span>${e.title}</a>`).join('');
  main.innerHTML = EXAMPLES.map(e => `
    <section class="topic" id="${e.id}">
      <header><span class="tag">${e.tag}</span><h2>${e.title}</h2></header>
      <ul class="points">${e.points.map(p => `<li>${p}</li>`).join('')}</ul>
      <div class="runner" data-ex="${e.id}"></div>
      <p class="answer"><strong>一句话</strong>${e.answer.replace(/^答法：/, '')}</p>
    </section>`).join('');
  const runners = new Map();
  for (const e of EXAMPLES) runners.set(e.id, new Runner(e, main.querySelector(`.runner[data-ex="${e.id}"]`)));

  // 滚动时高亮导航
  const links = [...nav.querySelectorAll('a')];
  const io = new IntersectionObserver(es => { for (const en of es) if (en.isIntersecting) { links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id)); } }, {rootMargin: '-30% 0px -60% 0px'});
  document.querySelectorAll('.topic').forEach(t => io.observe(t));

  // 键盘：焦点在某个 runner 内时，F10 单步、F5 运行
  document.addEventListener('keydown', e => {
    const r = e.target.closest && e.target.closest('.runner'); if (!r) return;
    if (e.key === 'F10') { e.preventDefault(); runners.get(r.dataset.ex).step(); }
    if (e.key === 'F5') { e.preventDefault(); runners.get(r.dataset.ex).run(); }
  });
})();

</script>
