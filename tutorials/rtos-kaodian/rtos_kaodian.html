<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>RTOS 考点实验台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --surface2:#F6F8F9; --line:#D5DBE0; --ink:#1B2430; --muted:#5D6B7A;
  --accent:#1F7A5C; --accent-ink:#FFFFFF; --pc:#F3D27A; --pc-ink:#3A2E00;
  --run:#1F7A5C; --ready:#2F6FBF; --blocked:#C9861B; --susp:#8A94A0; --del:#B23A3A; --isr:#7B3FA0;
  --code-bg:#F9FAFB; --gutter:#EDF0F2; --changed:#FFF1C9; --bp:#C0392B;
  --t0:#1F7A5C; --t1:#2F6FBF; --t2:#C9861B; --t3:#7B3FA0; --t4:#B23A3A; --t5:#0E7C86; --tidle:#B8C0C8;
  --radius:6px; --mono:"JetBrains Mono",Consolas,"SF Mono",monospace; --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; --serif:"Noto Serif SC","Songti SC","SimSun",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --surface:#1C242E; --surface2:#222C38; --line:#334150; --ink:#E6EBF0; --muted:#93A1B0;
    --accent:#4FC08D; --accent-ink:#0E1A14; --pc:#6B5A1A; --pc-ink:#FFE9A8;
    --run:#4FC08D; --ready:#6FA3E8; --blocked:#E0A73A; --susp:#7C8794; --del:#E06666; --isr:#B48AE0;
    --code-bg:#161D26; --gutter:#1A222C; --changed:#4A3E14; --bp:#E06666;
    --t0:#4FC08D; --t1:#6FA3E8; --t2:#E0A73A; --t3:#B48AE0; --t4:#E06666; --t5:#4FB8C2; --tidle:#3A4654;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --surface:#1C242E; --surface2:#222C38; --line:#334150; --ink:#E6EBF0; --muted:#93A1B0;
  --accent:#4FC08D; --accent-ink:#0E1A14; --pc:#6B5A1A; --pc-ink:#FFE9A8;
  --run:#4FC08D; --ready:#6FA3E8; --blocked:#E0A73A; --susp:#7C8794; --del:#E06666; --isr:#B48AE0;
  --code-bg:#161D26; --gutter:#1A222C; --changed:#4A3E14; --bp:#E06666;
  --t0:#4FC08D; --t1:#6FA3E8; --t2:#E0A73A; --t3:#B48AE0; --t4:#E06666; --t5:#4FB8C2; --tidle:#3A4654;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:5px 11px}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
select{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:4px 6px}
code,pre,.mono{font-family:var(--mono)}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 380px;min-height:100vh}
header.top{grid-column:1/-1;display:flex;align-items:baseline;gap:16px;padding:14px 20px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
header.top h1{font-family:var(--serif);font-size:22px;margin:0;font-weight:700;letter-spacing:.02em}
header.top .sub{color:var(--muted);font-size:13px}
header.top .kbd{margin-left:auto;color:var(--muted);font-size:12px}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding:12px 8px 24px;overflow-y:auto;max-height:calc(100vh - 54px);position:sticky;top:54px}
nav.side .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
nav.side .grp:first-child{margin-top:0}
nav.side a{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--radius);color:var(--ink);text-decoration:none;font-size:13px;line-height:1.35}
nav.side a:hover{background:var(--surface2)}
nav.side a.active{background:var(--accent);color:var(--accent-ink)}
nav.side a .n{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;flex:none}
nav.side a.active .n{color:var(--accent-ink);opacity:.8}
nav.side a .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;margin-left:auto}
nav.side a.active .dot{background:var(--accent-ink)}
main{padding:18px 22px 40px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
main h2{font-family:var(--serif);font-size:24px;margin:2px 0 12px;text-wrap:balance;line-height:1.3}
.one,.analogy{max-width:72ch;padding:10px 14px;border-radius:var(--radius);margin:0 0 10px;font-size:14.5px;line-height:1.65}
.one{background:var(--accent);color:var(--accent-ink);font-weight:500}
.analogy{background:var(--surface2);border:1px dashed var(--line);color:var(--ink)}
.one span,.analogy span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-bottom:3px}
.qa-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.qa{display:grid;gap:10px;margin-bottom:18px;max-width:72ch}
.qa .item{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.qa .q{font-weight:700}
.qa .a{color:var(--ink);white-space:pre-line}
.qa .a code{font-size:12.5px;background:var(--surface2);padding:0 4px;border-radius:3px}
.note{font-size:12.5px;color:var(--muted);margin:0 0 10px;max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2);border-radius:var(--radius) var(--radius) 0 0}
.toolbar .st{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.toolbar .st b{color:var(--ink);font-weight:600}
.codewrap{overflow-x:auto;background:var(--code-bg);border-radius:0 0 var(--radius) var(--radius)}
table.code{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;line-height:1.55;width:100%}
table.code td{padding:0 10px 0 0;white-space:pre;vertical-align:top}
table.code td.g{width:34px;text-align:right;color:var(--muted);background:var(--gutter);padding:0 8px 0 6px;user-select:none;cursor:pointer;position:relative}
table.code td.g:hover{color:var(--ink)}
table.code tr.bp td.g::before{content:"";position:absolute;left:2px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--bp)}
table.code td.m{width:14px;padding:0;text-align:center;font-size:10px}
table.code tr.pc td.c{background:var(--pc);color:var(--pc-ink)}
table.code tr.pc td.g{font-weight:600;color:var(--ink)}
table.code td.c{padding-left:8px}
table.code tr.other td.c{box-shadow:inset 3px 0 0 var(--mk)}
.halt{margin:8px 0 0;padding:8px 10px;border-radius:var(--radius);background:var(--changed);color:var(--ink);font-size:13px}
.halt:empty{display:none}
aside.dbg{border-left:1px solid var(--line);background:var(--surface);padding:12px 12px 30px;overflow-y:auto;max-height:calc(100vh - 54px);position:sticky;top:54px;display:grid;gap:12px;align-content:start}
aside h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:8px}
aside h3 .hint{font-weight:400;letter-spacing:0;text-transform:none;font-size:11px;margin-left:auto}
table.d{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.d th{text-align:left;font-weight:500;color:var(--muted);padding:2px 6px;border-bottom:1px solid var(--line);font-size:11px}
table.d td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.d tr:last-child td{border-bottom:0}
table.d td.mono{font-family:var(--mono);font-size:11.5px}
table.d td.chg{background:var(--changed)}
.pill{display:inline-block;padding:0 7px;border-radius:10px;font-size:11px;line-height:18px;color:#fff;white-space:nowrap}
.pill.RUNNING{background:var(--run)} .pill.READY{background:var(--ready)} .pill.BLOCKED{background:var(--blocked)} .pill.SUSPENDED{background:var(--susp)} .pill.DELETED{background:var(--del)} .pill.ISR{background:var(--isr)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stack{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:3px;border:1px solid var(--line)}
.stack i{display:block;height:100%;background:var(--accent)}
.stack i.warn{background:var(--blocked)} .stack i.over{background:var(--del)}
.console{font-family:var(--mono);font-size:11.5px;background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;height:150px;overflow-y:auto;white-space:pre-wrap;line-height:1.5}
.console .t{color:var(--muted)} .console .k{color:var(--muted);font-style:italic} .console .e{color:var(--del)}
.tl{display:flex;flex-wrap:nowrap;gap:1px;overflow-x:auto;padding-bottom:2px}
.tl i{flex:none;width:7px;height:18px;border-radius:1px;background:var(--tidle)}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:11px;color:var(--muted);margin-top:4px}
.obj{font-family:var(--mono);font-size:11.5px;padding:4px 6px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.obj:last-child{border-bottom:0}
.obj .k{color:var(--muted)}
.empty{color:var(--muted);font-size:12px;padding:6px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:6px}
.static{padding:12px;color:var(--muted);font-size:12.5px}
@media (max-width:1100px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  aside.dbg{grid-column:1/-1;position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  nav.side{position:static;max-height:220px;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:14px 16px 24px}
  header.top{padding:12px 16px 8px;flex-wrap:wrap}
  header.top .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <h1>RTOS 考点实验台</h1>
    <span class="sub">32 个考点，每个先给一句话和一个比方，再看最短的代码。绿点的考点可以一步步跑给你看。</span>
    <span class="kbd">F10 步进 · F5 运行 · 点行号打断点</span>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
  <aside class="dbg" id="dbg"></aside>
</div>

<script>
// RTOS 考点实验台 — 迷你 FreeRTOS 内核模拟器（教学用，行为按 FreeRTOS 语义近似）
// 约定：1 步 = 运行任务执行 1 行 C 代码 = 1 个 tick（中断服务程序不消耗 tick）
window.RTOS = (function () {
  const STATE_CN = { RUNNING: '运行', READY: '就绪', BLOCKED: '阻塞', SUSPENDED: '挂起', DELETED: '已删除' };
  const pdTRUE = 1, pdFALSE = 0, INF = Infinity;

  // ---------- 记录构造器（生成器里 yield 的对象） ----------
  function mkK(sim) {
    const r = (where, op, a) => Object.assign({ where, op }, a || {});
    return {
      pdTRUE, pdFALSE, portMAX_DELAY: INF,
      L: (w) => r(w, 'nop'),
      exec: (w, fn) => r(w, 'exec', { fn }),
      printf: (w, text) => r(w, 'printf', { text }),
      delay: (w, n) => r(w, 'delay', { n }),
      delayUntil: (w, n) => r(w, 'delayUntil', { n }),
      qSend: (w, q, val, t) => r(w, 'qSend', { q, val, t }),
      qSendFront: (w, q, val, t) => r(w, 'qSend', { q, val, t, front: true }),
      qRecv: (w, q, into, t) => r(w, 'qRecv', { q, into, t }),
      semTake: (w, s, t) => r(w, 'semTake', { s, t }),
      semGive: (w, s) => r(w, 'semGive', { s }),
      egWait: (w, eg, bits, all, clear, t) => r(w, 'egWait', { eg, bits, all, clear, t }),
      egSet: (w, eg, bits) => r(w, 'egSet', { eg, bits }),
      notifyGive: (w, task) => r(w, 'notifyGive', { task }),
      notifyTake: (w, clearAll, t) => r(w, 'notifyTake', { clearAll, t }),
      notifySet: (w, task, val, action) => r(w, 'notifySet', { task, val, action }),
      notifyWait: (w, clearOnExit, into, t) => r(w, 'notifyWait', { clearOnExit, into, t }),
      suspend: (w, task) => r(w, 'suspend', { task }),
      resume: (w, task) => r(w, 'resume', { task }),
      del: (w, task) => r(w, 'del', { task }),
      setPrio: (w, task, p) => r(w, 'setPrio', { task, p }),
      enterCritical: (w) => r(w, 'enterCritical'),
      exitCritical: (w) => r(w, 'exitCritical'),
      suspendAll: (w) => r(w, 'suspendAll'),
      resumeAll: (w) => r(w, 'resumeAll'),
      yield: (w) => r(w, 'yield'),
      timerStart: (w, tm) => r(w, 'timerStart', { tm }),
      timerStop: (w, tm) => r(w, 'timerStop', { tm }),
      timerReset: (w, tm) => r(w, 'timerStart', { tm }),
      stackUse: (w, n) => r(w, 'stackUse', { n }),
      stackFree: (w, n) => r(w, 'stackUse', { n: -n }),
      malloc: (w, name, n) => r(w, 'malloc', { name, n }),
      free: (w, name) => r(w, 'free', { name }),
      halt: (w, msg) => r(w, 'halt', { msg }),
      sleep: (w) => r(w, 'sleep'),
      // 中断上下文
      qSendISR: (w, q, val, woken) => r(w, 'qSendISR', { q, val, woken }),
      semGiveISR: (w, s, woken) => r(w, 'semGiveISR', { s, woken }),
      notifyGiveISR: (w, task, woken) => r(w, 'notifyGiveISR', { task, woken }),
      egSetISR: (w, eg, bits, woken) => r(w, 'egSetISR', { eg, bits, woken }),
      yieldFromISR: (w, woken) => r(w, 'yieldFromISR', { woken }),
      illegalBlockInISR: (w, s) => r(w, 'illegalBlock', { s }),
    };
  }

  // ---------- 内核对象 ----------
  function mkObj(sim, spec) {
    const o = { kind: spec.kind, name: spec.name, addr: sim.alloc(spec.size || 80, spec.name), waiting: [], waitingSend: [] };
    switch (spec.kind) {
      case 'queue': o.kindCN = '队列'; o.len = spec.len; o.items = []; break;
      case 'sem': o.kindCN = '二值信号量'; o.count = spec.init || 0; o.max = 1; break;
      case 'csem': o.kindCN = '计数信号量'; o.count = spec.init || 0; o.max = spec.max; break;
      case 'mutex': o.kindCN = '互斥量'; o.count = 1; o.max = 1; o.holder = null; break;
      case 'rmutex': o.kindCN = '递归互斥量'; o.count = 1; o.max = 1; o.holder = null; o.depth = 0; break;
      case 'eg': o.kindCN = '事件组'; o.bits = 0; break;
      case 'timer': o.kindCN = '软件定时器'; o.period = spec.period; o.auto = spec.auto !== false; o.cb = spec.cb; o.remaining = null; o.active = false; if (spec.start) { o.active = true; o.remaining = o.period; } break;
    }
    o.describe = function () {
      const w = this.waiting.map(t => t.name).join(',') || '无';
      switch (this.kind) {
        case 'queue': return [['长度', `${this.items.length} / ${this.len}`], ['内容', this.items.length ? '[' + this.items.join(', ') + ']' : '[]'], ['等待接收', w], ['等待发送', this.waitingSend.map(t => t.name).join(',') || '无']];
        case 'sem': return [['计数', `${this.count} (${this.count ? '可用' : '不可用'})`], ['等待', w]];
        case 'csem': return [['计数', `${this.count} / ${this.max}`], ['等待', w]];
        case 'mutex': return [['持有者', this.holder ? this.holder.name : '无(空闲)'], ['等待', w]];
        case 'rmutex': return [['持有者', this.holder ? this.holder.name : '无'], ['递归深度', this.depth], ['等待', w]];
        case 'eg': return [['事件位', '0b' + this.bits.toString(2).padStart(8, '0')], ['等待', this.waiting.map(t => `${t.name}(0b${t.egBits.toString(2)})`).join(',') || '无']];
        case 'timer': return [['周期', `${this.period} tick ${this.auto ? '自动重载' : '单次'}`], ['状态', this.active ? `运行中，剩余 ${this.remaining}` : '停止']];
      }
      return [];
    };
    return o;
  }

  function createSim(topic) {
    const spec = topic.sim;
    const sim = {
      tick: 0, stepNo: 0, log: [], timeline: [], tasks: [], objs: [], mem: [], running: null,
      critical: 0, schedSuspended: 0, halted: null, isrMasked: false, pendingISR: 0,
      heapSize: spec.heap || 10240, heapUsed: 0, heapNext: 0x20001000, ramNext: 0x20000000,
      forceSwitch: false, deferOnce: false, preempted: null, slicing: spec.slice !== false, colorSeq: 0,
      lines: topic.code.replace(/\n$/, '').split('\n'),
    };
    const O = {}; // 对象名 → 对象
    const M = { // 变量访问器
      get: n => { const c = sim.cell(n); return c ? c.val : undefined; },
      set: (n, v) => { const c = sim.cell(n); if (!c) return; c.val = v; c.changedAt = sim.stepNo + 1; return v; },
      obj: n => O[n],
    };
    sim.cell = n => sim.mem.find(c => c.name === n);
    sim.declare = (name, type, val) => { const size = /64|double/.test(type) ? 8 : /char|bool|8/.test(type) ? 1 : /16/.test(type) ? 2 : 4; const c = { name, type, val, addr: sim.ramNext, size, changedAt: -1 }; sim.mem.push(c); sim.ramNext += Math.max(4, size); return c; };
    sim.fmt = c => { if (typeof c.val === 'string') return c.val; if (c.type.includes('*') || /Handle/.test(c.type)) return c.val === 0 ? 'NULL' : '0x' + Number(c.val).toString(16).toUpperCase().padStart(8, '0'); return String(c.val); };
    sim.alloc = (n, what) => { const a = sim.heapNext; sim.heapNext += Math.ceil(n / 8) * 8; sim.heapUsed += n; if (sim.heapUsed > sim.heapSize) { sim.klog(`pvPortMalloc 失败：堆不足（申请 ${n} B，剩余 ${sim.heapSize - sim.heapUsed + n} B）`, 'e'); } return a; };
    sim.byName = n => sim.tasks.find(t => t.name === n);
    sim.klog = (text, kind) => sim.log.push({ tick: sim.tick, text, kind: kind || 'k' });
    sim.plog = text => sim.log.push({ tick: sim.tick, text, kind: 'p' });
    const K = mkK(sim);

    // 行号解析：'子串' 或 '子串#2'（第 2 次出现）
    function lineOf(where) {
      if (!where) return 0; if (typeof where === 'number') return where;
      let n = 1, key = where; const m = /^(.*)#(\d+)$/.exec(where); if (m) { key = m[1]; n = +m[2]; }
      for (let i = 0; i < sim.lines.length; i++) if (sim.lines[i].includes(key) && --n === 0) return i + 1;
      console.warn('未找到代码行:', where); return 0;
    }

    // 变量、对象、任务
    (spec.vars || []).forEach(([name, type, val]) => sim.declare(name, type, val));
    (spec.objs || []).forEach(s => { const o = mkObj(sim, s); sim.objs.push(o); O[s.name] = o; const c = sim.cell(s.name); if (c) c.val = o.addr; });
    function mkTask(t, pseudo) {
      const task = {
        name: t.name, prio: t.prio, basePrio: t.prio, state: 'READY', stackSize: t.stack || 512, stackUsed: Math.round((t.stack || 512) * 0.2), colorIdx: pseudo ? 0 : sim.colorSeq++,
        pseudo: !!pseudo, isISR: !!t.isISR, waitObj: null, waitKind: null, wakeTick: null, waitDesc: '', notifyVal: 0, lastRun: -1, egBits: 0, ret: undefined,
      };
      task.stackMax = task.stackUsed;
      if (!pseudo) { task.tcbAddr = sim.alloc(96, 'TCB ' + t.name); task.stackAddr = sim.alloc(task.stackSize, 'stack ' + t.name); const c = sim.cell(t.name + 'Handle') || sim.cell('h' + t.name); if (c) c.val = task.tcbAddr; }
      task.gen = t.run(K, M);
      const first = task.gen.next(); task.pc = first.done ? null : Object.assign({ line: lineOf(first.value.where) }, first.value);
      return task;
    }
    (spec.tasks || []).forEach(t => sim.tasks.push(mkTask(t)));
    sim.tasks.push(mkTask({ name: 'IDLE', prio: 0, stack: 128, run: function* (k, m) { while (true) { if (spec.idleHook) yield* spec.idleHook(k, m); else yield k.L(null); } } }));
    sim.tasks.forEach(t => { if (t.name === 'IDLE') t.colorIdx = 99; });

    // ---------- 阻塞 / 唤醒 ----------
    function block(t, obj, kind, timeout, desc, list) {
      t.state = 'BLOCKED'; t.waitObj = obj; t.waitKind = kind; t.waitDesc = desc; t.wakeTick = timeout === INF ? null : sim.tick + timeout;
      if (obj) { const l = list || obj.waiting; l.push(t); l.sort((a, b) => b.prio - a.prio); }
      if (sim.schedSuspended > 0 && !t.pseudo) sim.halt('configASSERT 失败：调度器挂起期间（vTaskSuspendAll 之后）调用了会阻塞的 API');
      return true;
    }
    function wake(t, ret, why) {
      if (t.state !== 'BLOCKED') return;
      if (t.waitObj) { const rm = l => { const i = l.indexOf(t); if (i >= 0) l.splice(i, 1); }; rm(t.waitObj.waiting); rm(t.waitObj.waitingSend); }
      t.state = 'READY'; t.waitObj = null; t.waitKind = null; t.waitDesc = ''; t.wakeTick = null;
      if (why) sim.klog(`${t.name} 就绪：${why}`);
      advance(t, ret);
      if (sim.running && !sim.running.isISR && t.prio > sim.running.prio && sim.schedSuspended === 0) sim.forceSwitch = true;
    }
    function advance(t, ret) {
      if (!t.gen) return;
      const n = t.gen.next(ret);
      if (n.done) { t.pc = null; if (t.pseudo) { t.state = 'DELETED'; } else { sim.halt(`任务 ${t.name} 的函数返回了！FreeRTOS 任务函数绝不能 return，必须 vTaskDelete(NULL)`); } return; }
      t.pc = Object.assign({ line: lineOf(n.value.where) }, n.value);
    }
    sim.halt = msg => { sim.halted = msg; sim.klog(msg, 'e'); };
    const findTask = ref => (ref == null ? sim.running : (typeof ref === 'string' ? sim.byName(ref) : ref));
    const cur = () => sim.running;

    // ---------- 执行一条记录 ----------
    function exec(t, rec) {
      const inISR = t.isISR;
      const badInISR = () => { sim.halt(`在中断里调用了非 FromISR 的 API（${rec.op}），可能阻塞或触发 configASSERT`); return pdFALSE; };
      switch (rec.op) {
        case 'nop': return;
        case 'exec': return rec.fn(M, t, sim);
        case 'printf': sim.plog(typeof rec.text === 'function' ? rec.text(M, t) : rec.text); return;
        case 'sleep': sim.klog('__WFI(): CPU 进入睡眠，等待中断/tick 唤醒'); return;
        case 'halt': sim.halt(rec.msg); return;
        case 'delay': if (inISR) return badInISR(); if (rec.n <= 0) return; block(t, null, 'delay', rec.n, `延时到 tick ${sim.tick + rec.n}`); return;
        case 'delayUntil': { if (t.lastWake == null) t.lastWake = sim.tick; const w = t.lastWake + rec.n; t.lastWake = w; if (w <= sim.tick) { sim.klog(`${t.name} vTaskDelayUntil：唤醒时刻已过，不阻塞直接返回`); return pdFALSE; } block(t, null, 'delay', w - sim.tick, `绝对延时到 tick ${w}`); return pdTRUE; }
        case 'qSend': { if (inISR) return badInISR(); const q = O[rec.q]; const v = typeof rec.val === 'function' ? rec.val(M) : rec.val;
          if (q.waiting.length) { const r = q.waiting[0]; M.set(r.waitInto, v); wake(r, pdTRUE, `收到 ${rec.q} 数据 ${v}`); return pdTRUE; }
          if (q.items.length < q.len) { rec.front ? q.items.unshift(v) : q.items.push(v); return pdTRUE; }
          if (rec.t === 0) { sim.klog(`${rec.q} 已满，${t.name} 立即返回 errQUEUE_FULL`); return pdFALSE; }
          t.pendVal = v; block(t, q, 'qSend', rec.t, `等待 ${rec.q} 有空位`, q.waitingSend); return; }
        case 'qRecv': { if (inISR) return badInISR(); const q = O[rec.q];
          if (q.items.length) { const v = q.items.shift(); M.set(rec.into, v); if (q.waitingSend.length) { const s = q.waitingSend[0]; q.items.push(s.pendVal); wake(s, pdTRUE, `${rec.q} 有空位，数据 ${s.pendVal} 已入队`); } return pdTRUE; }
          if (rec.t === 0) return pdFALSE;
          t.waitInto = rec.into; block(t, q, 'qRecv', rec.t, `等待 ${rec.q} 有数据`); return; }
        case 'semTake': { if (inISR) return badInISR(); const s = O[rec.s];
          if (s.kind === 'rmutex' && s.holder === t) { s.depth++; return pdTRUE; }
          if (s.count > 0) { s.count--; if (s.holder !== undefined) { s.holder = t; if (s.kind === 'rmutex') s.depth = 1; } return pdTRUE; }
          if (rec.t === 0) return pdFALSE;
          if (s.holder && s.holder.prio < t.prio) { sim.klog(`优先级继承：${s.holder.name} 的优先级 ${s.holder.prio} → ${t.prio}（因 ${t.name} 等待 ${rec.s}）`); s.holder.prio = t.prio; }
          if (s.holder === t) sim.klog(`${t.name} 重复获取自己持有的互斥量 ${rec.s}，将永久阻塞（自死锁）`, 'e');
          block(t, s, 'sem', rec.t, `等待 ${rec.s}`); return; }
        case 'semGive': { if (inISR) return badInISR(); const s = O[rec.s];
          if (s.holder !== undefined) { if (s.holder !== t) { sim.klog(`${t.name} 释放不属于自己的互斥量 ${rec.s}，返回 pdFALSE`, 'e'); return pdFALSE; }
            if (s.kind === 'rmutex' && --s.depth > 0) return pdTRUE;
            if (t.prio !== t.basePrio) { sim.klog(`取消继承：${t.name} 优先级恢复 ${t.prio} → ${t.basePrio}`); t.prio = t.basePrio; sim.forceSwitch = true; } }
          return give(s, t, rec.s); }
        case 'egWait': { if (inISR) return badInISR(); const eg = O[rec.eg]; const ok = rec.all ? (eg.bits & rec.bits) === rec.bits : (eg.bits & rec.bits) !== 0;
          if (ok) { const got = eg.bits; if (rec.clear) eg.bits &= ~rec.bits; return got; }
          if (rec.t === 0) return eg.bits;
          t.egBits = rec.bits; t.egAll = rec.all; t.egClear = rec.clear; block(t, eg, 'eg', rec.t, `等待事件位 0b${rec.bits.toString(2)}${rec.all ? '(全部)' : '(任一)'}`); return; }
        case 'egSet': { if (inISR) return badInISR(); egSet(O[rec.eg], rec.bits); return; }
        case 'notifyGive': { if (inISR) return badInISR(); const d = findTask(rec.task); d.notifyVal++; if (d.state === 'BLOCKED' && d.waitKind === 'notify') { const v = d.notifyVal; d.notifyVal = d.clearAll ? 0 : v - 1; wake(d, v, '收到任务通知'); } return; }
        case 'notifyTake': { if (inISR) return badInISR(); if (t.notifyVal > 0) { const v = t.notifyVal; t.notifyVal = rec.clearAll ? 0 : v - 1; return v; } if (rec.t === 0) return 0; t.clearAll = rec.clearAll; block(t, null, 'notify', rec.t, '等待任务通知'); return; }
        case 'notifySet': { if (inISR) return badInISR(); const d = findTask(rec.task); if (rec.action === 'eSetBits') d.notifyVal |= rec.val; else if (rec.action === 'eIncrement') d.notifyVal++; else d.notifyVal = rec.val;
          if (d.state === 'BLOCKED' && d.waitKind === 'notify') { const v = d.notifyVal; M.set(d.waitInto, v); if (d.clearOnExit) d.notifyVal &= ~d.clearOnExit; wake(d, pdTRUE, '收到任务通知'); } return pdTRUE; }
        case 'notifyWait': { if (inISR) return badInISR(); if (t.notifyVal) { const v = t.notifyVal; M.set(rec.into, v); t.notifyVal &= ~rec.clearOnExit; return pdTRUE; } if (rec.t === 0) return pdFALSE; t.waitInto = rec.into; t.clearOnExit = rec.clearOnExit; block(t, null, 'notify', rec.t, '等待任务通知'); return; }
        case 'suspend': { const d = findTask(rec.task); if (d.state === 'BLOCKED') wake(d, pdFALSE); d.state = 'SUSPENDED'; d.waitDesc = '等待 vTaskResume'; sim.klog(`${d.name} 被挂起`); if (d === t) { d.selfSusp = true; sim.forceSwitch = true; } return; }
        case 'resume': { const d = findTask(rec.task); if (d.state === 'SUSPENDED') { d.state = 'READY'; d.waitDesc = ''; sim.klog(`${d.name} 被恢复为就绪`); if (d.selfSusp) { d.selfSusp = false; advance(d, undefined); } if (d.prio > t.prio) sim.forceSwitch = true; } return; }
        case 'del': { const d = findTask(rec.task); if (d.state === 'BLOCKED') wake(d, pdFALSE); d.state = 'DELETED'; d.pc = null; d.gen = null;
          if (d === t) { d.waitDesc = '等待空闲任务回收 TCB/栈'; d.pendingFree = true; sim.klog(`${d.name} 删除自己，TCB 与栈由空闲任务释放`); sim.forceSwitch = true; }
          else { sim.heapUsed -= 96 + d.stackSize; sim.klog(`${d.name} 被 ${t.name} 删除，TCB 与栈立即释放`); } return; }
        case 'setPrio': { const d = findTask(rec.task); sim.klog(`${d.name} 优先级 ${d.prio} → ${rec.p}`); d.prio = d.basePrio = rec.p; sim.forceSwitch = true; return; }
        case 'enterCritical': sim.critical++; if (sim.critical === 1) sim.klog('taskENTER_CRITICAL：BASEPRI 抬高，屏蔽 ≤configMAX_SYSCALL_INTERRUPT_PRIORITY 的中断'); return;
        case 'exitCritical': if (sim.critical > 0) sim.critical--; if (sim.critical === 0) { sim.klog('taskEXIT_CRITICAL：恢复中断'); if (sim.pendingISR) { sim.pendingISR = 0; sim.isrMasked = false; sim.klog('被屏蔽的中断现在响应'); sim.triggerISR(); } } return;
        case 'suspendAll': sim.schedSuspended++; sim.klog('vTaskSuspendAll：调度器挂起，中断仍开启，但不会切换任务'); return;
        case 'resumeAll': if (sim.schedSuspended > 0) sim.schedSuspended--; if (sim.schedSuspended === 0) { sim.klog('xTaskResumeAll：调度器恢复，处理挂起期间就绪的任务'); sim.forceSwitch = true; } return;
        case 'yield': sim.forceSwitch = true; sim.yieldRR = true; return;
        case 'timerStart': { const tm = O[rec.tm]; tm.active = true; tm.remaining = tm.period; sim.klog(`${rec.tm} 启动/复位，${tm.period} tick 后到期`); return pdTRUE; }
        case 'timerStop': { O[rec.tm].active = false; return pdTRUE; }
        case 'stackUse': { t.stackUsed += rec.n; if (t.stackUsed > t.stackMax) t.stackMax = t.stackUsed; if (t.stackUsed > t.stackSize) { if (spec.stackCheck) sim.halt(`vApplicationStackOverflowHook(${t.name})：栈溢出被检测到（configCHECK_FOR_STACK_OVERFLOW=2）`); else sim.klog(`${t.name} 栈溢出 ${t.stackUsed - t.stackSize} B，未开启检测——正在悄悄踩坏相邻内存！`, 'e'); } return; }
        case 'malloc': { if (sim.heapUsed + rec.n > sim.heapSize) { M.set(rec.name, 0); sim.klog(`pvPortMalloc(${rec.n}) 返回 NULL：堆剩余 ${sim.heapSize - sim.heapUsed} B`, 'e'); return 0; } const a = sim.alloc(rec.n); M.set(rec.name, a); t.blocks = t.blocks || {}; t.blocks[rec.name] = rec.n; return a; }
        case 'free': { const n = t.blocks && t.blocks[rec.name]; if (n) { sim.heapUsed -= n; delete t.blocks[rec.name]; } M.set(rec.name, 0); return; }
        // ---- 中断上下文 ----
        case 'qSendISR': { const q = O[rec.q]; const v = typeof rec.val === 'function' ? rec.val(M) : rec.val; if (q.waiting.length) { const r = q.waiting[0]; M.set(r.waitInto, v); wokenCheck(r, rec.woken); wake(r, pdTRUE, `中断送来 ${rec.q} 数据 ${v}`); return pdTRUE; } if (q.items.length < q.len) { q.items.push(v); return pdTRUE; } sim.klog(`${rec.q} 已满，中断里的数据 ${v} 被丢弃`, 'e'); return pdFALSE; }
        case 'semGiveISR': { const s = O[rec.s]; if (s.holder !== undefined) { sim.halt('互斥量不能在中断里使用（没有 xSemaphoreGiveFromISR 对应的互斥语义）'); return; } if (s.waiting.length) { const r = s.waiting[0]; wokenCheck(r, rec.woken); wake(r, pdTRUE, `中断释放 ${rec.s}`); return pdTRUE; } if (s.count < s.max) { s.count++; return pdTRUE; } return pdFALSE; }
        case 'notifyGiveISR': { const d = findTask(rec.task); d.notifyVal++; if (d.state === 'BLOCKED' && d.waitKind === 'notify') { const v = d.notifyVal; d.notifyVal = d.clearAll ? 0 : v - 1; wokenCheck(d, rec.woken); wake(d, v, '中断发来任务通知'); } return; }
        case 'egSetISR': { egSet(O[rec.eg], rec.bits, rec.woken); return; }
        case 'yieldFromISR': { const w = M.get(rec.woken); if (w) { sim.isrYield = true; sim.klog('portYIELD_FROM_ISR(pdTRUE)：挂起 PendSV，中断退出后立即切换到被唤醒的高优先级任务'); } else sim.klog('portYIELD_FROM_ISR(pdFALSE)：不切换，被唤醒的任务等下一个 tick'); return; }
        case 'illegalBlock': { sim.halt(`在中断里调用 xSemaphoreTake(${rec.s}, portMAX_DELAY)：中断没有任务上下文，无法阻塞，configASSERT 触发 / 系统挂死`); return; }
      }
      function wokenCheck(readied, wokenVar) { const p = sim.preempted || sim.running; if (wokenVar && p && readied.prio > p.prio) { M.set(wokenVar, 1); sim.klog(`${readied.name}(优先级 ${readied.prio}) 高于被打断的 ${p.name}(${p.prio})，xHigherPriorityTaskWoken = pdTRUE`); } }
      function give(s, t, name) { if (s.waiting.length) { const r = s.waiting[0]; if (s.holder !== undefined) { s.holder = r; if (s.kind === 'rmutex') s.depth = 1; } wake(r, pdTRUE, `获得 ${name}`); return pdTRUE; } if (s.holder !== undefined) s.holder = null; if (s.count < s.max) { s.count++; return pdTRUE; } sim.klog(`${name} 计数已达上限 ${s.max}，Give 返回 pdFALSE`); return pdFALSE; }
      function egSet(eg, bits, wokenVar) { eg.bits |= bits; const ws = eg.waiting.slice(); let clr = 0; ws.forEach(w => { const ok = w.egAll ? (eg.bits & w.egBits) === w.egBits : (eg.bits & w.egBits) !== 0; if (ok) { if (w.egClear) clr |= w.egBits; if (wokenVar) wokenCheck(w, wokenVar); wake(w, eg.bits, `事件位满足 0b${w.egBits.toString(2)}`); } }); eg.bits &= ~clr; }
    }

    // ---------- 中断 ----------
    sim.triggerISR = function () {
      if (!spec.isr || sim.halted) return;
      if (sim.critical > 0) { sim.pendingISR = 1; sim.isrMasked = true; sim.klog(`${spec.isr.name} 触发，但处于临界区，中断被 BASEPRI 屏蔽，挂起等待`); return; }
      if (sim.tasks.some(t => t.isISR && t.state !== 'DELETED')) return;
      const isr = mkTask({ name: spec.isr.name, prio: 1e9, isISR: true, run: spec.isr.run }, true);
      const w = sim.cell('xHigherPriorityTaskWoken'); if (w) { w.val = 0; }
      sim.preempted = sim.running; if (sim.running) sim.running.state = 'READY'; sim.isrYield = false;
      sim.tasks.push(isr); sim.running = isr; isr.state = 'RUNNING';
      sim.klog(`⚡ ${spec.isr.name} 进入（打断了 ${sim.preempted ? sim.preempted.name : '—'}，硬件自动压栈 R0-R3,R12,LR,PC,xPSR）`);
    };

    // ---------- 调度 ----------
    function pick() {
      const isr = sim.tasks.find(t => t.isISR && t.state !== 'DELETED'); if (isr) return isr;
      const ready = sim.tasks.filter(t => (t.state === 'READY' || t.state === 'RUNNING') && !t.isISR);
      if (!ready.length) return null;
      const top = Math.max(...ready.map(t => t.prio));
      const cands = ready.filter(t => t.prio === top);
      const prev = sim.running;
      if (sim.schedSuspended > 0 && prev && !prev.isISR && (prev.state === 'READY' || prev.state === 'RUNNING')) return prev;
      if (sim.deferOnce && prev && (prev.state === 'READY' || prev.state === 'RUNNING') && !prev.isISR) { sim.deferOnce = false; sim.klog(`没有 portYIELD_FROM_ISR，${prev.name} 先继续执行到下一个 tick`); return prev; }
      if (cands.length === 1) return cands[0];
      if (prev && cands.includes(prev) && !sim.slicing && !sim.yieldRR) return prev;
      return cands.reduce((a, b) => (a.lastRun <= b.lastRun ? a : b));
    }
    function reschedule() {
      const n = pick();
      if (n !== sim.running) {
        if (sim.running && sim.running.state === 'RUNNING') sim.running.state = 'READY';
        if (n && sim.running && !sim.running.isISR && n && !n.isISR) sim.klog(`PendSV 上下文切换：${sim.running.name} → ${n.name}`);
        sim.running = n;
      }
      if (sim.running) sim.running.state = 'RUNNING';
      sim.forceSwitch = false; sim.yieldRR = false;
    }
    function onTick() {
      sim.tick++;
      if (spec.tickHook) spec.tickHook(sim, M);
      sim.tasks.forEach(t => { if (t.state === 'BLOCKED' && t.wakeTick != null && t.wakeTick <= sim.tick) { const why = t.waitKind === 'delay' ? '延时到期' : `等待超时(${t.waitDesc})`; wake(t, t.waitKind === 'delay' ? undefined : (t.waitKind === 'notify' ? 0 : pdFALSE), why); } });
      sim.objs.forEach(tm => { if (tm.kind === 'timer' && tm.active && --tm.remaining <= 0) { if (tm.auto) tm.remaining = tm.period; else tm.active = false; sim.klog(`${tm.name} 到期 → 回调在定时器守护任务 TmrSvc 中执行`); const d = mkTask({ name: 'TmrSvc(' + tm.name + ')', prio: spec.timerPrio || 3, run: tm.cb }, true); sim.tasks.push(d); if (d.prio > (sim.running ? sim.running.prio : -1)) sim.forceSwitch = true; } });
    }

    sim.step = function () {
      if (sim.halted) return;
      if (!sim.running) reschedule();
      const t = sim.running; if (!t) return;
      sim.stepNo++;
      const rec = t.pc;
      if (rec) { const ret = exec(t, rec); if (t.state !== 'BLOCKED' && t.state !== 'SUSPENDED' && t.state !== 'DELETED') advance(t, ret); }
      t.lastRun = sim.stepNo;
      if (t.isISR) {
        if (t.state === 'DELETED' || !t.pc) { t.state = 'DELETED'; sim.klog(`${t.name} 退出`); if (sim.isrYield) sim.forceSwitch = true; else if (sim.tasks.some(x => x.state === 'READY' && sim.preempted && x.prio > sim.preempted.prio)) sim.deferOnce = true; sim.running = sim.preempted; if (sim.running && sim.running.state === 'READY') sim.running.state = 'RUNNING'; sim.preempted = null; sim.tasks.splice(sim.tasks.indexOf(t), 1); reschedule(); }
        return;
      }
      if (t.pseudo && (t.state === 'DELETED' || !t.pc)) { t.state = 'DELETED'; sim.tasks.splice(sim.tasks.indexOf(t), 1); }
      sim.timeline.push(t.name);
      if (t.name === 'IDLE') sim.tasks.filter(x => x.pendingFree).forEach(x => { x.pendingFree = false; x.waitDesc = '已回收'; sim.heapUsed -= 96 + x.stackSize; sim.klog(`空闲任务回收了 ${x.name} 的 TCB 与栈（释放 ${96 + x.stackSize} B）`); });
      onTick();
      reschedule();
    };
    reschedule();
    return sim;
  }
  return { createSim, STATE_CN };
})();

<script>
// 考点 01–16（小白版）：基础概念、同步与通信（前半）
window.RTOS_TOPICS = [
// ============ 基础概念 ============
{
id:'rtos-vs-bare', group:'基础概念', title:'为什么要用 RTOS',
one:'RTOS 就是一个"排班老板"：把程序拆成几个员工（任务），谁的事急就先让谁干。',
analogy:'裸机像一个人开小卖部：收银、补货、擦地全自己按顺序来，收银排队时地就没人擦。RTOS 像雇了三个人，还有个老板盯着，顾客一来收银员立刻上。',
qa:[
 {q:'裸机的问题是什么？', a:'所有事在一个大循环里排队。前面一件事耗时长，后面的事就得干等，反应慢。'},
 {q:'RTOS 好在哪？', a:'每件事是独立的任务，有自己的<b>优先级</b>。急事一来，老板（调度器）马上停下手头不急的活去处理，反应快、代码也不缠在一起。'},
 {q:'面试一句话总结？', a:'RTOS 用"任务 + 优先级 + 调度器"，把顺序执行的程序变成能随时被急事打断的多任务程序。'},
],
code:`/* 裸机：一个人干所有活，轮着看 */
int main(void)
{
    while (1) {
        check_key();      /* 处理按键要 200ms          */
        check_uart();     /* 串口数据来了也得等上面做完 */
        refresh_lcd();
    }
}

/* RTOS：每件事一个员工（任务），急事先干 */
void KeyTask(void *p)  { for (;;) { wait_key();  do_key();  } }   /* 优先级 2 */
void UartTask(void *p) { for (;;) { wait_uart(); do_uart(); } }   /* 优先级 3：更急，能打断 KeyTask */
void LcdTask(void *p)  { for (;;) { refresh_lcd(); vTaskDelay(50); } } /* 优先级 1 */

int main(void)
{
    xTaskCreate(KeyTask,  "key",  128, NULL, 2, NULL);   /* 招三个员工 */
    xTaskCreate(UartTask, "uart", 128, NULL, 3, NULL);
    xTaskCreate(LcdTask,  "lcd",  128, NULL, 1, NULL);
    vTaskStartScheduler();                               /* 老板开始排班，永不返回 */
}`,
},
{
id:'task-states', group:'基础概念', title:'任务的四种状态',
one:'任务只有四种状态：正在干（运行）、排队等干（就绪）、在等东西（阻塞）、被叫停（挂起）。',
analogy:'员工要么在干活，要么站着等老板叫，要么在等快递来（快递到了自动醒），要么被老板停职（老板不说复工就一直停）。',

 {q:'哪些函数会让任务阻塞？', a:'vTaskDelay（等时间）、xQueueReceive（等数据）、xSemaphoreTake（等信号）……凡是"等"的函数都会。'},
],
note:'点"步进"，看右侧任务表里 TaskA 的状态变化：运行 → 阻塞 → 就绪 → 运行 → 挂起，TaskB 每 6 tick 把它叫醒一次。',
code:`TaskHandle_t TaskAHandle;

void vTaskA(void *p)                 /* 优先级 2 */
{
    for (;;) {
        printf("A running\\n");       /* 运行 */
        vTaskDelay(3);                /* 阻塞：睡 3 个 tick，到点自动醒 */
        vTaskSuspend(NULL);           /* 挂起：把自己停掉，等别人叫 */
        printf("A resumed\\n");
    }
}

void vTaskB(void *p)                 /* 优先级 1 */
{
    for (;;) {
        vTaskDelay(6);
        vTaskResume(TaskAHandle);     /* 叫醒 A，A 优先级高，立刻抢过 CPU */
    }
}`,

id:'context-switch', group:'基础概念', title:'任务切换时发生了什么',
one:'切换 = 把当前任务的寄存器存到它的栈上，再从下一个任务的栈上把寄存器取出来。',
analogy:'两个人轮流用一张桌子。换人时，前一个人把桌上的东西装进自己的箱子（压栈），后一个人从自己的箱子里把东西摆回桌上（出栈）。',
qa:[
 {q:'谁来做这件事？', a:'Cortex-M 上由 <b>PendSV</b> 中断做。SysTick（心跳）只负责判断"该换人了"，然后触发 PendSV。'},
 {q:'为什么放在 PendSV 里？', a:'PendSV 优先级设成最低，保证其它中断都处理完了才切换，不会切到一半被别的中断搅乱。'},
 {q:'存了哪些寄存器？', a:'进中断时硬件<b>自动</b>存 8 个（R0-R3、R12、LR、PC、xPSR），PendSV 里软件<b>手动</b>再存 8 个（R4-R11）。栈指针 SP 存在档案卡（TCB）第一格。'},
],
code:`/* PendSV 中断，简化成 5 步 */
void PendSV_Handler(void)
{
    /* 1. 硬件已自动把 R0-R3,R12,LR,PC,xPSR 压到当前任务栈 */
    push(R4..R11);                    /* 2. 软件再压剩下的 8 个 */
    currentTCB->sp = SP;              /* 3. 栈顶位置记到档案卡 */

    vTaskSwitchContext();             /* 4. 选下一个任务，改 currentTCB */

    SP = currentTCB->sp;              /* 5. 换成新任务的栈 */
    pop(R4..R11);                     /*    取回它的寄存器 */
    return;                           /*    硬件自动弹出剩下 8 个，任务接着跑 */
}

/* 心跳中断只判断，不切换 */
void SysTick_Handler(void)
{
    if (xTaskIncrementTick())         /* 有更急的任务醒了？ */
        trigger_PendSV();             /* 触发 PendSV 去换人 */
}`,
},

void vTaskA(void *p)                 /* 用 vTaskDelay */

code:`QueueHandle_t xQueue;                /* 长度 3 */
int txVal = 0, rxVal = 0, dropped = 0;

void vProducer(void *p)              /* 优先级 1 */
{
    for (;;) {
        txVal++;
        if (xQueueSend(xQueue, &txVal, 0) != pdPASS)   /* 等 0：满了立刻放弃 */
            dropped++;
    }
}

void vConsumer(void *p)              /* 优先级 2 */
{
    for (;;) {
        xQueueReceive(xQueue, &rxVal, portMAX_DELAY);  /* 空了就等 */
        process(rxVal);
        vTaskDelay(3);
    }
}`,

int handled = 0, bg = 0;

void EXTI_IRQHandler(void)           /* 中断：只按铃 */
{
    BaseType_t woken = pdFALSE;
    xSemaphoreGiveFromISR(xSem, &woken);
    portYIELD_FROM_ISR(woken);        /* 有人被叫醒就立刻切过去 */
}

void vHandlerTask(void *p)           /* 优先级 2：听铃干活 */
{
    for (;;) {
        xSemaphoreTake(xSem, portMAX_DELAY);   /* 没铃声就睡 */
        handled++;
        heavy_work();                 /* 耗时的活放这里 */
    }
}

void vBackgroundTask(void *p) { for (;;) { bg++; } }   /* 优先级 1 */`,

code:`SemaphoreHandle_t xMutex;           /* 钥匙 */
int shared = 0, mWork = 0;

void vLowTask(void *p)               /* 优先级 1 */
{
    for (;;) {
        xSemaphoreTake(xMutex, portMAX_DELAY);
        shared++;                     /* 拿着钥匙干 4 步 */
        shared++;
        shared++;
        shared++;
        xSemaphoreGive(xMutex);       /* 还钥匙，优先级恢复 1 */
        vTaskDelay(10);
    }
}

void vMidTask(void *p)               /* 优先级 2：与锁无关 */
{
    for (;;) { vTaskDelay(2); mWork++; mWork++; mWork++; mWork++; }
}

void vHighTask(void *p)              /* 优先级 3 */
{
    for (;;) {
        vTaskDelay(1);
        xSemaphoreTake(xMutex, portMAX_DELAY);   /* Low 拿着 → 等，Low 被提到 3 */
        shared++;
        xSemaphoreGive(xMutex);
        vTaskDelay(10);
    }
}`,

code:`SemaphoreHandle_t xRMutex;          /* 递归钥匙 */

void flush_log(void)
{
    xSemaphoreTakeRecursive(xRMutex, portMAX_DELAY);  /* 深度 1 → 2 */
    uart_send();
    xSemaphoreGiveRecursive(xRMutex);                 /* 深度 2 → 1 */
}

void write_log(void)
{
    xSemaphoreTakeRecursive(xRMutex, portMAX_DELAY);  /* 深度 0 → 1 */
    format();
    flush_log();                                      /* 里面再拿一次，不会死锁 */
    xSemaphoreGiveRecursive(xRMutex);                 /* 深度 1 → 0，真正还了 */
}

void vLogTask(void *p)   { for (;;) { write_log(); vTaskDelay(3); } }
void vOtherTask(void *p) { for (;;) { write_log(); vTaskDelay(4); } }`,

code:`SemaphoreHandle_t xA, xB;           /* 两把钥匙 */

void vTask1(void *p)                 /* 先 A 后 B */
{
    for (;;) {
        xSemaphoreTake(xA, portMAX_DELAY);
        xSemaphoreTake(xB, portMAX_DELAY);   /* B 在 T2 手里… */
        use_both();
        xSemaphoreGive(xB);
        xSemaphoreGive(xA);
    }
}

void vTask2(void *p)                 /* 先 B 后 A：顺序反了 */
{
    for (;;) {
        xSemaphoreTake(xB, portMAX_DELAY);
        xSemaphoreTake(xA, portMAX_DELAY);   /* A 在 T1 手里… 死锁 */
        use_both();
        xSemaphoreGive(xA);
        xSemaphoreGive(xB);
    }

],
note:'点"触发中断"。本例偶数次调用 portYIELD_FROM_ISR、奇数次故意不调：看日志里 Handler 是"立即运行"还是"Background 先多跑一行"。',
code:`QueueHandle_t xQ;
int isrCount = 0, rxData = 0, bg = 0;

void ADC_IRQHandler(void)
{
    BaseType_t woken = pdFALSE;
    int sample = ADC->DR;
    xQueueSendFromISR(xQ, &sample, &woken);    /* 不会阻塞 */
    if (isrCount % 2 == 0)
        portYIELD_FROM_ISR(woken);             /* 偶数次：立刻换人 */
    /* 奇数次故意不调：Handler 要等下一个 tick */
    isrCount++;
}

void vHandlerTask(void *p)           /* 优先级 3 */
{
    for (;;) {
        xQueueReceive(xQ, &rxData, portMAX_DELAY);
        printf("sample\\n");
    }
}

void vBackgroundTask(void *p) { for (;;) { bg++; } }   /* 优先级 1 */`,

one:'用一条线（configMAX_SYSCALL_INTERRUPT_PRIORITY）把中断分两类：线以下的能调 RTOS 函数，线以上的绝对不能。',

qa:[
 {q:'Cortex-M 的数字怎么理解？', a:'<b>数字越小越急</b>。STM32 常设分界线为 5：优先级 5~15 的中断能调 FromISR 函数，0~4 的不能。'},
 {q:'配错会怎样？', a:'高优先级中断调了 RTOS 函数，会在内核改数据改到一半时插进来，表现为偶尔莫名其妙崩溃，很难查。'},
 {q:'NVIC 分组？', a:'必须设成 4 位全抢占（NVIC_PriorityGroup_4）。'},
],
code:`/* FreeRTOSConfig.h（STM32） */
#define configMAX_SYSCALL_INTERRUPT_PRIORITY  (5 << 4)   /* 分界线：优先级 5 */
#define configKERNEL_INTERRUPT_PRIORITY       (15 << 4)  /* PendSV / SysTick 最低 */

/* main.c */
NVIC_PriorityGroupConfig(NVIC_PriorityGroup_4);          /* 4 位全抢占 */

HAL_NVIC_SetPriority(USART1_IRQn, 6, 0);   /* 6 在线以下：可以调 xQueueSendFromISR */
HAL_NVIC_SetPriority(TIM2_IRQn,   2, 0);   /* 2 在线以上：永远不被屏蔽，
                                              但里面禁止调任何 FreeRTOS 函数 */

/*  优先级   0  1  2  3  4 │ 5  6  ...  15
    被临界区屏蔽？  否     │ 是
    能调 FromISR？  否     │ 是                    */`,

one:'临界区是"谁都别打扰我"（中断也挡住）；挂起调度器是"别的任务别打扰我"（中断照常来）。',
analogy:'临界区像把手机关机：几秒钟内谁都找不到你。挂起调度器像挂"忙碌"：电话照接，但同事不能插队安排你干别的。',

note:'步进到第 8~9 行时点"触发中断"：中断被挡住，退出临界区才响应。步进到第 14~16 行再点：中断马上跑，Handler 变就绪，但到 xTaskResumeAll 才切换过去。',
code:`SemaphoreHandle_t xSem;
int shared = 0;

void vTaskA(void *p)                 /* 优先级 1 */
{
    for (;;) {
        taskENTER_CRITICAL();         /* 手机关机：中断被挡 */
        shared++;
        shared++;
        taskEXIT_CRITICAL();          /* 开机：被挡的中断现在进来 */
        vTaskDelay(2);

        vTaskSuspendAll();            /* 挂"忙碌"：中断照常，任务不切换 */
        shared++;
        shared++;
        shared++;
        xTaskResumeAll();             /* 取消忙碌：该切换的现在切 */
        vTaskDelay(2);
    }
}

void EXTI_IRQHandler(void)
{
    BaseType_t woken = pdFALSE;
    xSemaphoreGiveFromISR(xSem, &woken);
    portYIELD_FROM_ISR(woken);
}

void vHandlerTask(void *p)           /* 优先级 2 */
{ for (;;) { xSemaphoreTake(xSem, portMAX_DELAY); printf("handled\\n"); } }`,

uint8_t *p1, *p2, *p3;
int freeHeap;

void vApplicationMallocFailedHook(void)
{
    printf("malloc failed!\\n");      /* 申请失败时被调用 */
}

void vAllocTask(void *p)
{
    p1 = pvPortMalloc(1200);
    p2 = pvPortMalloc(1200);
    p3 = pvPortMalloc(1200);          /* 仓库只剩 96 B → 失败，返回 NULL */

    for (;;) { vTaskDelay(10); }
}`,

code:`/* configCHECK_FOR_STACK_OVERFLOW = 2 */
int hwm;

void vApplicationStackOverflowHook(TaskHandle_t t, char *name)
{
    printf("STACK OVERFLOW: %s\\n", name);
    for (;;);                         /* 停住，等看门狗复位 */
}

int parse(int depth)                  /* 每层占 96 字节 */
{
    char local[96];
    if (depth == 0) return 0;
    return parse(depth - 1) + 1;      /* 递归 6 层 = 576 B > 512 B */
}

void vDeepTask(void *p)              /* 栈 512 B */
{
    for (;;) { parse(6); vTaskDelay(3); }
}

void vMonTask(void *p)
{
    for (;;) { hwm = uxTaskGetStackHighWaterMark(hDeep); vTaskDelay(1); }
}`,

code:`EventGroupHandle_t xAlive;          /* 考勤表：每个任务一位 */
#define BIT_SENSOR (1<<0)
#define BIT_COMM   (1<<1)
SemaphoreHandle_t xNever;            /* 永远等不到的信号量 */
int fed = 0;

void vSensorTask(void *p) { for (;;) { read(); xEventGroupSetBits(xAlive, BIT_SENSOR); vTaskDelay(3); } }

void vCommTask(void *p)              /* tick 20 后卡死 */
{
    for (;;) {
        if (xTaskGetTickCount() > 20)
            xSemaphoreTake(xNever, portMAX_DELAY);   /* 永远等不到 → 卡死 */
        xEventGroupSetBits(xAlive, BIT_COMM);        /* 打卡 */
        vTaskDelay(2);
    }
}

void vMonitorTask(void *p)           /* 优先级 3 */
{
    for (;;) {
        vTaskDelay(8);
        int b = xEventGroupGetBits(xAlive);
        if (b == (BIT_SENSOR | BIT_COMM)) {
            xEventGroupClearBits(xAlive, b);
            IWDG_Feed(); fed++;       /* 全员打卡才喂狗 */
        } else {
            printf("task dead\\n");   /* 不喂 → 硬件复位 */
        }
    }
}`,

code:`volatile int counter = 0;            /* volatile 挡不住竞争 */
int tmpA, tmpB;

void vTaskA(void *p)                 /* 优先级 1 */
{
    for (int i = 0; i < 10; i++) {
        tmpA = counter;               /* 读 */
        tmpA = tmpA + 1;              /* 加 */
        counter = tmpA;               /* 写：可能覆盖 B 刚写的 */
    }
    vTaskDelete(NULL);
}

void vTaskB(void *p)                 /* 优先级 1 */
{
    for (int i = 0; i < 10; i++) {
        tmpB = counter;
        tmpB = tmpB + 1;
        counter = tmpB;
    }
    vTaskDelete(NULL);
}

  {name:'TaskB',prio:1,run:function*(k,m){ for(let i=0;i<10;i++){ yield k.exec('tmpB = counter',m=>m.set('tmpB',m.get('counter'))); yield k.exec('tmpB = tmpB + 1',m=>m.set('tmpB',m.get('tmpB')+1)); yield k.exec('counter = tmpB',m=>m.set('counter',m.get('tmpB'))); } yield k.del('vTaskDelete(NULL);#2',null); }},
 ]},
},
{
id:'tickless', group:'内存与稳定性', title:'tick 与低功耗',
one:'tick 是系统心跳。没人干活时可以暂停心跳、让 CPU 深睡，到该醒的时候再补上心跳数，这叫 Tickless。',
analogy:'值夜班的人知道下一个闹钟是 3 小时后，就把每分钟一响的秒表关了，定个 3 小时的闹钟直接睡，醒来把钟拨到正确时间。',
qa:[
 {q:'tick 频率怎么选？', a:'一般 1000Hz（1ms）。频率越高延时越精细，但心跳中断本身也耗电耗 CPU。'},
 {q:'延时怎么写才不依赖 tick 频率？', a:'用 pdMS_TO_TICKS(500) 而不是直接写 500。'},
],
code:`/* FreeRTOSConfig.h */
#define configTICK_RATE_HZ       1000     /* 1 tick = 1 ms */
#define configUSE_TICKLESS_IDLE  1        /* 开 Tickless */

/* 空闲时内核自动调用（简化） */
void vPortSuppressTicksAndSleep(TickType_t idleTicks)
{
    stop_systick();                       /* 关心跳 */
    set_wakeup_timer(idleTicks);          /* 定一个 idleTicks 后的闹钟 */
    __WFI();                              /* 深睡 */
    vTaskStepTick(actually_slept());      /* 醒来补上心跳数 */
    start_systick();
}

vTaskDelay(pdMS_TO_TICKS(500));           /* 500ms，和 tick 频率无关 */`,
},

id:'config', group:'配置与对比', title:'FreeRTOSConfig.h 里最该认识的几个',
one:'配置文件是 RTOS 的"开关面板"，面试常问的就十来个。',
qa:[
 {q:'哪几个必须会？', a:'configUSE_PREEMPTION（抢占开关）、configTICK_RATE_HZ（心跳频率）、configMAX_PRIORITIES（几级优先级）、configTOTAL_HEAP_SIZE（仓库多大）、configMINIMAL_STACK_SIZE（空闲任务的栈，单位是字）、configCHECK_FOR_STACK_OVERFLOW（栈溢出检测）、configMAX_SYSCALL_INTERRUPT_PRIORITY（中断分界线）。'},
 {q:'configASSERT 是什么？', a:'内核自带的"错误检查点"，抓中断优先级配错、句柄为空这类低级错误，出错就停在那里方便调试。开发阶段一定要开。'},
],
code:`#define configUSE_PREEMPTION            1     /* 抢占：急事先干 */
#define configUSE_TIME_SLICING          1     /* 同级轮流 */
#define configTICK_RATE_HZ              1000  /* 心跳 1ms */
#define configMAX_PRIORITIES            8     /* 0~7 共 8 级 */
#define configMINIMAL_STACK_SIZE        128   /* 字！= 512 字节 */
#define configTOTAL_HEAP_SIZE           (16 * 1024)
#define configUSE_MUTEXES               1
#define configUSE_TIMERS                1
#define configTIMER_TASK_PRIORITY       7     /* 定时器秘书的优先级 */
#define configUSE_IDLE_HOOK             1
#define configCHECK_FOR_STACK_OVERFLOW  2     /* 栈溢出检测 */
#define configUSE_MALLOC_FAILED_HOOK    1     /* 内存不够时报警 */
#define configMAX_SYSCALL_INTERRUPT_PRIORITY (5 << 4)   /* 中断分界线 */

#define configASSERT(x) if ((x) == 0) { taskDISABLE_INTERRUPTS(); for (;;); }`,
},

qa:[
 {q:'FreeRTOS 和 Linux 的区别？', a:'Linux 有进程隔离、内存 MB 级、启动要几秒、不保证实时。FreeRTOS 所有任务共用内存、内存 KB 级、毫秒启动、微秒级响应。'},
 {q:'几个 RTOS 怎么选？', a:'<b>FreeRTOS</b>：免费、最小、移植最多，适合学习和大部分产品。\n<b>RT-Thread</b>：国产，文件系统、网络、GUI 都自带。\n<b>uC/OS</b>：医疗航空要认证时用。\n<b>Zephyr</b>：蓝牙、网络协议栈最全，学习曲线陡。'},
 {q:'FreeRTOS 支持双核吗？', a:'支持（SMP 版本），ESP32 用的就是。可以把任务钉在某个核上。'},

</script>
<script>
(function(){
  const TOPICS = window.RTOS_TOPICS;
  const nav = document.getElementById('nav'), main = document.getElementById('main'), dbg = document.getElementById('dbg');
  let cur = null, sim = null, timer = null, bps = new Set();
  const TCOL = ['var(--t0)','var(--t1)','var(--t2)','var(--t3)','var(--t4)','var(--t5)'];

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function hex(n){return '0x'+n.toString(16).toUpperCase().padStart(8,'0');}

  // ---------- nav ----------
  (function buildNav(){
    let g=''; let html='';
    TOPICS.forEach((t,i)=>{
      if(t.group!==g){g=t.group;html+=`<div class="grp">${esc(g)}</div>`;}
      html+=`<a href="#${t.id}" data-i="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${esc(t.title)}</span>${t.sim?'<span class="dot" title="可运行"></span>':''}</a>`;
    });
    nav.innerHTML=html;
    nav.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();open(+a.dataset.i);history.replaceState(null,'','#'+TOPICS[+a.dataset.i].id);});
  })();

  function taskColor(t){ if(!t) return 'var(--tidle)'; if(t.isISR) return 'var(--isr)'; if(t.name==='IDLE') return 'var(--tidle)'; return TCOL[t.colorIdx%TCOL.length]; }

  // 为可运行例子自动补一段 main()：把"优先级在哪里定"显示出来
  function genMain(t){
    const s=t.sim; if(!s || /int main\s*\(/.test(t.code)) return '';
    const fns=[...t.code.matchAll(/void\s+(\w+)\s*\(\s*void\s*\*\s*\w*\s*\)/g)].map(m=>m[1]);
    const norm=n=>n.replace(/^v/,'').replace(/Task$/,'').toLowerCase();
    const findFn=name=>{ const n=name.toLowerCase(), alt=n.replace(/^t(\d)$/,'task$1'); return fns.find(f=>norm(f)===n||norm(f)===alt||f.toLowerCase()===n) || (fns.length===1?fns[0]:null); };
    const vars=(s.vars||[]).map(v=>v[0]);
    const out=['','int main(void)','{'];
    (s.objs||[]).forEach(o=>{ let c=''; switch(o.kind){
      case 'queue': c=`xQueueCreate(${o.len}, sizeof(int))`; break;
      case 'sem': c='xSemaphoreCreateBinary()'+(o.init?';  xSemaphoreGive('+o.name+')':''); break;
      case 'csem': c=`xSemaphoreCreateCounting(${o.max}, ${o.init||0})`; break;
      case 'mutex': c='xSemaphoreCreateMutex()'; break;
      case 'rmutex': c='xSemaphoreCreateRecursiveMutex()'; break;
      case 'eg': c='xEventGroupCreate()'; break;
      case 'timer': { const cb=(t.code.match(/void\s+(\w+)\s*\(\s*TimerHandle_t/)||[])[1]||'cb'; c=`xTimerCreate("t", ${o.period}, ${o.auto!==false?'pdTRUE':'pdFALSE'}, NULL, ${cb})`; } }
      if(c) out.push(`    ${o.name} = ${c};`); });
    if(s.objs&&s.objs.length) out.push('');
    s.tasks.forEach(tk=>{ const fn=findFn(tk.name)||'vTask'; const h=vars.find(v=>v.toLowerCase()===(tk.name+'handle').toLowerCase()||v.toLowerCase()==='h'+tk.name.toLowerCase());
      out.push(`    xTaskCreate(${fn}, "${tk.name}", 128, NULL, ${tk.prio}, ${h?'&'+h:'NULL'});`); });
    out.push('    /*          函数名     任务名  栈   参数  ↑优先级  句柄 */');
    out.push('    vTaskStartScheduler();            /* 老板开始排班 */','}');
    return out.join('\n');
  }

  // ---------- open topic ----------
  function open(i){
    stopRun();
    cur = TOPICS[i]; bps = new Set(cur.bps||[]);
    nav.querySelectorAll('a').forEach(a=>a.classList.toggle('active',+a.dataset.i===i));
    sim = cur.sim ? RTOS.createSim(cur) : null;
    const lines = (cur.code.replace(/\n$/,'')+genMain(cur)).split('\n');
    let html = `<div class="eyebrow">${esc(cur.group)} · 考点 ${String(i+1).padStart(2,'0')}</div><h2>${esc(cur.title)}</h2>`;
    if(cur.one) html += `<div class="one"><span>一句话</span>${esc(cur.one)}</div>`;
    if(cur.analogy) html += `<div class="analogy"><span>打个比方</span>${esc(cur.analogy)}</div>`;
    html += `<div class="qa"><div class="qa-h">面试怎么答</div>${cur.qa.map(x=>`<div class="item"><div class="q">${esc(x.q)}</div><div class="a">${x.a}</div></div>`).join('')}</div>`;
    if(cur.note) html += `<p class="note"><b>动手看：</b>${cur.note}</p>`;
    html += `<div class="panel"><div class="toolbar" id="tb">`;
    if(sim){
      html += `<button class="primary" id="bStep">步进 ⏵</button><button id="bRun">运行 ▶▶</button><button id="bReset">重置</button>`;
      if(cur.sim.isr) html += `<button id="bIsr">触发中断 ⚡ ${esc(cur.sim.isr.name)}</button>`;
      html += `<select id="speed" title="运行速度"><option value="400">慢速</option><option value="150" selected>中速</option><option value="40">快速</option></select>`;
      html += `<span class="st"><span>tick <b id="stTick">0</b></span><span>运行中 <b id="stRun">—</b></span><span id="stCrit"></span></span>`;
    } else {
      html += `<span class="static">此考点为概念题，代码仅供阅读，不需要运行。</span>`;
    }
    html += `</div><div class="codewrap"><table class="code" id="code">`;
    lines.forEach((l,n)=>{ html += `<tr data-l="${n+1}"><td class="g">${n+1}</td><td class="m"></td><td class="c">${esc(l)||' '}</td></tr>`; });
    html += `</table></div></div><div class="halt" id="halt"></div>`;
    main.innerHTML = html; main.scrollTop=0; window.scrollTo(0,0);
    document.getElementById('code').addEventListener('click',e=>{const g=e.target.closest('td.g');if(!g)return;const l=+g.parentNode.dataset.l;bps.has(l)?bps.delete(l):bps.add(l);paintCode();});
    if(sim){
      document.getElementById('bStep').onclick=()=>{stopRun();doStep();};
      document.getElementById('bRun').onclick=toggleRun;
      document.getElementById('bReset').onclick=()=>{stopRun();sim=RTOS.createSim(cur);render();};
      const bi=document.getElementById('bIsr'); if(bi) bi.onclick=()=>{sim.triggerISR();render();};
    }
    render();
  }

  function doStep(){ if(!sim||sim.halted) return; sim.step(); render(); }
  function toggleRun(){ if(timer) stopRun(); else startRun(); }
  function startRun(){
    if(!sim||sim.halted) return;
    const ms=+document.getElementById('speed').value;
    document.getElementById('bRun').textContent='暂停 ❚❚';
    timer=setInterval(()=>{ sim.step(); render(); const r=sim.running; if(sim.halted || (r && bps.has(r.pc&&r.pc.line))) stopRun(); },ms);
  }
  function stopRun(){ if(timer){clearInterval(timer);timer=null;} const b=document.getElementById('bRun'); if(b) b.textContent='运行 ▶▶'; }
  document.addEventListener('keydown',e=>{ if(e.key==='F10'){e.preventDefault();stopRun();doStep();} if(e.key==='F5'){e.preventDefault();toggleRun();} });

  // ---------- render ----------
  function paintCode(){
    const rows=document.querySelectorAll('#code tr');
    rows.forEach(r=>{ r.classList.toggle('bp',bps.has(+r.dataset.l)); r.classList.remove('pc','other'); r.style.removeProperty('--mk'); r.querySelector('td.m').textContent=''; });
    if(!sim) return;
    sim.tasks.forEach(t=>{
      if(!t.pc||!t.pc.line||t.state==='DELETED') return;
      const r=document.querySelector(`#code tr[data-l="${t.pc.line}"]`); if(!r) return;
      const m=r.querySelector('td.m');
      if(t===sim.running){ r.classList.add('pc'); m.textContent='▶'; m.style.color=taskColor(t); }
      else { r.classList.add('other'); r.style.setProperty('--mk',taskColor(t)); if(!m.textContent){ m.textContent=t.state==='BLOCKED'?'◌':'○'; m.style.color=taskColor(t);} }
    });
  }

  function render(){
    paintCode();
    if(!sim){ dbg.innerHTML='<div class="empty">当前考点没有模拟程序。选择左侧带绿点的考点即可运行。</div>'; return; }
    const st=document.getElementById('stTick'); if(st){ st.textContent=sim.tick; document.getElementById('stRun').textContent=sim.running?sim.running.name:'—';
      const c=document.getElementById('stCrit'); c.textContent=(sim.critical>0?`临界区×${sim.critical} `:'')+(sim.schedSuspended>0?`调度器挂起×${sim.schedSuspended} `:'')+(sim.isrMasked?'中断已屏蔽(BASEPRI) ':''); }
    document.getElementById('halt').textContent=sim.halted||'';
    let h='';
    // tasks
    h+=`<section><h3>任务 <span class="hint">TCB / 优先级 / 状态 / 栈</span></h3><table class="d"><tr><th>任务</th><th>优先</th><th>状态</th><th>行</th><th>栈使用 / 高水位</th></tr>`;
    sim.tasks.forEach(t=>{
      if(t.pseudo && t.state==='DELETED') return;
      const pct=Math.min(100,Math.round(t.stackUsed/t.stackSize*100));
      const cls=t.stackUsed>t.stackSize?'over':(pct>80?'warn':'');
      const prio = t.prio!==t.basePrio ? `${t.prio}<span class="tag" title="优先级继承">继承自${t.basePrio}</span>` : (t.isISR?'IRQ':t.prio);
      h+=`<tr><td><span class="sw" style="background:${taskColor(t)}"></span>${esc(t.name)}${t.pseudo?'':`<div class="mono" style="color:var(--muted);font-size:10.5px">TCB ${hex(t.tcbAddr)}</div>`}</td><td class="mono">${prio}</td><td><span class="pill ${t.isISR?'ISR':t.state}">${t.isISR?'中断':RTOS.STATE_CN[t.state]}</span>${t.waitDesc?`<div style="font-size:10.5px;color:var(--muted)">${esc(t.waitDesc)}</div>`:''}</td><td class="mono">${t.pc&&t.pc.line||''}</td>`;
      h+= t.pseudo ? '<td></td>' : `<td class="mono">${t.stackUsed}/${t.stackSize} B<br>HWM ${Math.max(0,t.stackSize-t.stackMax)} B<div class="stack"><i class="${cls}" style="width:${pct}%"></i></div></td>`;
      h+='</tr>';
    });
    h+='</table></section>';
    // kernel objects
    h+=`<section><h3>内核对象 <span class="hint">堆上分配</span></h3><div class="panel">`;
    if(!sim.objs.length) h+='<div class="empty">无</div>';
    sim.objs.forEach(o=>{ h+=`<div class="obj"><span class="k">${esc(o.kindCN)}</span><span><b>${esc(o.name)}</b> @ ${hex(o.addr)}</span>${o.describe().map(([k,v])=>`<span class="k">${esc(k)}</span><span>${esc(v)}</span>`).join('')}</div>`; });
    h+='</div></section>';
    // memory
    h+=`<section><h3>变量 / 内存 <span class="hint">RAM 从 0x20000000 起</span></h3><table class="d"><tr><th>地址</th><th>变量</th><th>值</th></tr>`;
    sim.mem.forEach(c=>{ h+=`<tr><td class="mono">${hex(c.addr)}</td><td class="mono">${esc(c.type)} ${esc(c.name)}</td><td class="mono ${c.changedAt===sim.stepNo?'chg':''}">${esc(sim.fmt(c))}</td></tr>`; });
    h+=`<tr><td class="mono">堆</td><td class="mono">ucHeap[]</td><td class="mono">已用 ${sim.heapUsed} / ${sim.heapSize} B，空闲 ${sim.heapSize-sim.heapUsed} B</td></tr></table></section>`;
    // timeline
    h+=`<section><h3>CPU 时间线 <span class="hint">每格 1 tick</span></h3><div class="tl">${sim.timeline.slice(-140).map(n=>`<i style="background:${taskColor(sim.byName(n)||(n.startsWith('TmrSvc')?{isISR:true}:null))}" title="${esc(n)}"></i>`).join('')}</div><div class="legend">${sim.tasks.filter(t=>!(t.pseudo&&!t.isISR)).map(t=>`<span><span class="sw" style="background:${taskColor(t)}"></span>${esc(t.name)}</span>`).join('')}</div></section>`;
    // console
    h+=`<section><h3>串口输出 / 内核日志</h3><div class="console" id="con">${sim.log.slice(-200).map(l=>`<div><span class="t">[${String(l.tick).padStart(4,' ')}]</span> ${l.kind==='k'?`<span class="k">${esc(l.text)}</span>`:l.kind==='e'?`<span class="e">${esc(l.text)}</span>`:esc(l.text)}</div>`).join('')}</div></section>`;
    dbg.innerHTML=h;
    const con=document.getElementById('con'); con.scrollTop=con.scrollHeight;
  }

  const start = TOPICS.findIndex(t=>'#'+t.id===location.hash);
  open(start>=0?start:0);
})();
</script>
